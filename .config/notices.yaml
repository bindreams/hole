          THEORY OF LIABILITY, WHETHER IN CONTRACT, STRICT LIABILITY, OR TORT\n\
          (INCLUDING NEGLIGENCE OR OTHERWISE) ARISING IN ANY WAY OUT OF THE USE\n\
          OF THIS SOFTWARE, EVEN IF ADVISED OF THE POSSIBILITY OF SUCH DAMAGE."
  - name: ex-ray (code derived from shadowsocks/v2ray-plugin)
    license: MIT
    dir: crates/ex-ray # LICENSE carries the upstream MIT text
    url: https://github.com/shadowsocks/v2ray-plugin

# `overrides`: what a component's own files lack, for the component of one `ecosystem` (crate, go or npm) by name and
# optional version. `license` sets the expression of a component whose ecosystem declares
# none; `texts` supplies a licence text (`text`), only its holder line (`notice`), or, where upstream ships no licence
# text at all, what upstream does state (`upstream_words`), each with the upstream URL it was read from.
