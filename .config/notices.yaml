  # Upstream ships no licence text at all, so `upstream_words` holds what upstream does say, verbatim, and the standard
  # text of the licence is printed after it, without a copyright line: no holder is invented.
  # memalloc 0.1.0 and its upstream repository distribute no licence file and no copyright line. The words are the
  # Cargo.toml lines and the README.md section.
  - name: memalloc
    ecosystem: crate
    version: "0.1.0"
    platforms: [windows]
    texts:
      - license: MIT
        source: https://github.com/reem/rust-memalloc/blob/8deb399aa8a1ba864d41ccc1631ddc6ec8b1c1bb/README.md
        upstream_words: |
          authors = ["Jonathan Reem <jonathan.reem@gmail.com>"]
          license = "MIT"

          ## License

          MIT

  # The objc2 repository distributes no MIT text and no copyright line for these four crates: its LICENSE.md names the
  # MIT licence by link only. The words are that file, as upstream distributes it at each crate's commit.
  - name: objc2
    ecosystem: crate
    version: "0.6.4"
    platforms: [darwin]
    texts:
      - license: MIT
        source: https://raw.githubusercontent.com/madsmtm/objc2/8852b424193ca41602281b3d7540d7c8ed51e49a/LICENSE.md
        upstream_words: &objc2_upstream_words |
          # License

          The licensing of these crates is a bit complicated:
          - The crates `objc2`, `block2`, `objc2-foundation` and `objc2-encode` are
            [currently][#23] licensed under [the MIT license][MIT].
          - All other crates are trio-licensed under the [Zlib], [Apache-2.0] or [MIT]
            license, at your option.

          Furthermore, the crates are (usually automatically) derived from Apple SDKs,
          and that may have implications for licensing, see below for details.

          [#23]: https://github.com/madsmtm/objc2/issues/23
          [MIT]: https://opensource.org/license/MIT
          [Zlib]: https://zlib.net/zlib_license.html
          [Apache-2.0]: https://www.apache.org/licenses/LICENSE-2.0


          ## Apple SDKs

          These crates are derived from Apple SDKs shipped with Xcode. You can obtain a
          copy of the Xcode license at:

          https://www.apple.com/legal/sla/docs/xcode.pdf

          Or by typing `xcodebuild -license` in your terminal.

          From reading the license, it is unclear whether distributing derived works
          such as these crates are allowed?

          But in any case, to practically use these crates, you will have to link, and
          that only works when you have the correct Xcode SDK available to provide the
          required `.tbd` files, which is why we choose to still use the normal SPDX
          identifiers in the crates (Xcode is required to use the crates, and when using
          Xcode you have already agreed to the Xcode license).
  - name: block2
    ecosystem: crate
    version: "0.6.2"
    platforms: [darwin]
    texts:
      - license: MIT
        source: https://raw.githubusercontent.com/madsmtm/objc2/b4167b582b2f75f9a1be75495c41b765344fd03c/LICENSE.md
