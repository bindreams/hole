# Input to `cargo xtask notices`, which writes the third-party notices file of a `hole` artifact.
#
# `licenses`: a licence is on this list when it is compatible with GPL-3.0-or-later and its duty for a binary copy is
# met by the notices file. Membership allows, position prefers: where a component's licence expression offers a choice,
# the first listed licence it allows is the one followed and printed.
#   text: shared            the standard text names no holder; printed once, with the components under it
#   text: shared-with-notice  as shared, and the component's NOTICE files are printed too
#   text: own               the text names a holder; the component's own licence files are printed whole
# A licence that prints its standard text (`shared`, `shared-with-notice`) must have one in the spdx crate: a
# `LicenseRef-` licence is `text: own`.
licenses:
  - {id: Apache-2.0, text: shared-with-notice}
  - {id: MIT, text: own}
  - {id: BSD-3-Clause, text: own}
  - {id: BSD-2-Clause, text: own}
  - {id: ISC, text: own}
  - {id: Unicode-3.0, text: own}
  - {id: Zlib, text: own}
  - {id: 0BSD, text: own}
  - {id: MIT-0, text: own}
  - {id: Unlicense, text: shared}
  - {id: CC0-1.0, text: shared}
  - {id: BSL-1.0, text: shared}
  - {id: WTFPL, text: shared}
  - {id: CDLA-Permissive-2.0, text: shared}
  - {id: MPL-2.0, text: shared}
  - {id: OFL-1.1, text: own}
  # Wintun's own licence, shipped as a separate binary beside hole.exe that Hole uses only through its public API, which
  # its section 3(d) allows. Not a licence of code linked into Hole.
  - {id: LicenseRef-Wintun-Prebuilt-Binaries, text: own}

# `declared`: components no package manager lists (fonts, shipped binaries, the Rust and Go standard libraries).
declared:
  - name: Inter
    version: "4.001"
    license: OFL-1.1
    files: [ui/fonts/inter-latin.woff2]
    texts:
      - license: OFL-1.1
        notice: "Copyright (c) 2016 The Inter Project Authors (https://github.com/rsms/inter)"
        source: https://github.com/rsms/inter/blob/353b61b9f4430d5f420d56605a6e7993e0941470/LICENSE.txt
  - name: Fira Code
    version: "5.002"
    license: OFL-1.1
    files: [ui/fonts/firacode-latin.woff2]
    texts:
      - license: OFL-1.1
        notice: "Copyright (c) 2014, The Fira Code Project Authors (https://github.com/tonsky/FiraCode)"
        source: https://github.com/tonsky/FiraCode/blob/ecd367b040ad92a28b64fa93135775f7e2417b37/LICENSE
  - name: Wintun
    version: "0.14.1"
    license: LicenseRef-Wintun-Prebuilt-Binaries
    platforms: [windows]
    files: [.cache/wintun/wintun.dll]
    dir: .cache/wintun # LICENSE.txt of the pinned zip, kept beside the DLL by `cargo xtask wintun`
    url: https://www.wintun.net/
  # Linked into every Rust binary of the artifact, with third-party crates and the Unicode tables of its own. Its section is
  # the pinned toolchain's copyright file for it, whole; the entry's licence is the one that file states for its own code.
  - name: Rust standard library
    version_from: rust-toolchain
    text_from: rust-toolchain-copyright
    license: MIT OR Apache-2.0
    url: https://github.com/rust-lang/rust
  # Linked into `ex-ray`. Its version and its `LICENSE` are those of the Go toolchain that builds `ex-ray` (`go env
  # GOVERSION`, `go env GOROOT`), which is no file's pin: `go.mod`'s `toolchain` line is a minimum.
  - name: Go standard library
    version_from: go-toolchain
    text_from: go-toolchain
    license: BSD-3-Clause
    url: https://go.dev/
  # `hole.exe` links `WebView2LoaderStatic.lib` (`webview2-com-sys` selects the static loader on `msvc`), which
  # Microsoft ships in the NuGet package `Microsoft.Web.WebView2`. The crate bundles the library without the package's
  # licence; its x64 library is byte for byte that of SDK 1.0.3800.47.
  # The package's `NOTICE.txt` covers `tools/wv2winrt`, which is not linked.
  - name: Microsoft Edge WebView2 SDK
    version: "1.0.3800.47"
    license: BSD-3-Clause
    platforms: [windows]
    url: https://www.nuget.org/packages/Microsoft.Web.WebView2/1.0.3800.47
    texts:
      - license: BSD-3-Clause
        source: https://api.nuget.org/v3-flatcontainer/microsoft.web.webview2/1.0.3800.47/microsoft.web.webview2.1.0.3800.47.nupkg (LICENSE.txt in the package)
        text: "Copyright (C) Microsoft Corporation. All rights reserved.\n\
          \n\
          Redistribution and use in source and binary forms, with or without\n\
          modification, are permitted provided that the following conditions are\n\
          met:\n\
          \n\
          \   * Redistributions of source code must retain the above copyright\n\
          notice, this list of conditions and the following disclaimer.\n\
          \   * Redistributions in binary form must reproduce the above\n\
          copyright notice, this list of conditions and the following disclaimer\n\
          in the documentation and/or other materials provided with the\n\
          distribution.\n\
          \   * The name of Microsoft Corporation, or the names of its contributors \n\
          may not be used to endorse or promote products derived from this\n\
          software without specific prior written permission.\n\
          \n\
          THIS SOFTWARE IS PROVIDED BY THE COPYRIGHT HOLDERS AND CONTRIBUTORS\n\
          \"AS IS\" AND ANY EXPRESS OR IMPLIED WARRANTIES, INCLUDING, BUT NOT\n\
          LIMITED TO, THE IMPLIED WARRANTIES OF MERCHANTABILITY AND FITNESS FOR\n\
          A PARTICULAR PURPOSE ARE DISCLAIMED. IN NO EVENT SHALL THE COPYRIGHT\n\
          OWNER OR CONTRIBUTORS BE LIABLE FOR ANY DIRECT, INDIRECT, INCIDENTAL,\n\
