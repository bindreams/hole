[project]
name = "dmg-installer"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = ["dmgbuild>=1.6", "ds_store>=1.3"]

[project.scripts]
build = "dmg_installer.build:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dmg_installer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `install_e2e` tests install a root daemon on the host: opt in with `-m install_e2e`.
addopts = "-m 'not install_e2e'"
markers = ["install_e2e: installs the built app's bridge as root and connects through it (CI runners only)"]

[dependency-groups]
dev = ["pytest"]
