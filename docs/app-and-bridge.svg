    <rect class="dg-tile" x="136" y="140" width="28" height="28" rx="6.5" fill="#1e1e1e"/>
    <g transform="translate(142 146) scale(.6667)"><path class="dg-glyph-light" d="M12 19h8M4 17l6-6-6-6"/></g>
  </g>

  <!-- TUN device -->
  <rect class="dg-machine" x="144" y="132" width="48" height="48" rx="10.8"/>
  <g class="dg-icon" transform="translate(156 144)">
    <path d="M10 8v1" />
    <path d="M14 8v1" />
    <path d="M18 8v1" />
    <path d="M19 17a2 2 0 00-1.765 1.059l-.47.882A2 2 0 0115 20H9a2 2 0 01-1.765-1.059l-.47-.882A2 2 0 005 17H4a2 2 0 01-2-2V6a2 2 0 012-2h16a2 2 0 012 2v9a2 2 0 01-2 2z" />
    <path d="M6 8v1" />
  </g>

  <!-- Hole: one program, running as the app and as the bridge -->
  <image href="_static/icon-macos.svg" x="266" y="28" width="48" height="48"/>
  <rect class="dg-tile" x="266" y="28" width="48" height="48" rx="10.8" fill="none"/>
  <image href="_static/icon-macos.svg" x="266" y="132" width="48" height="48"/>
  <rect class="dg-tile" x="266" y="132" width="48" height="48" rx="10.8" fill="none"/>

  <!-- Plugin: dashed, because a config does not have to name one -->
  <rect class="dg-machine dg-optional" x="380" y="132" width="48" height="48" rx="10.8"/>
  <g class="dg-icon" transform="translate(392 144)">
    <path d="M15.39 4.39a1 1 0 0 0 1.68-.474 2.5 2.5 0 1 1 3.014 3.015 1 1 0 0 0-.474 1.68l1.683 1.682a2.414 2.414 0 0 1 0 3.414L19.61 15.39a1 1 0 0 1-1.68-.474 2.5 2.5 0 1 0-3.014 3.015 1 1 0 0 1 .474 1.68l-1.683 1.682a2.414 2.414 0 0 1-3.414 0L8.61 19.61a1 1 0 0 0-1.68.474 2.5 2.5 0 1 1-3.014-3.015 1 1 0 0 0 .474-1.68l-1.683-1.682a2.414 2.414 0 0 1 0-3.414L4.39 8.61a1 1 0 0 1 1.68.474 2.5 2.5 0 1 0 3.014-3.015 1 1 0 0 1-.474-1.68l1.683-1.682a2.414 2.414 0 0 1 3.414 0z" />
  </g>

  <!-- Server -->
  <rect class="dg-machine" x="608" y="132" width="48" height="48" rx="10.8"/>
  <g class="dg-icon" transform="translate(620 144)">
    <rect width="20" height="8" x="2" y="2" rx="2" ry="2" />
    <rect width="20" height="8" x="2" y="14" rx="2" ry="2" />
    <line x1="6" x2="6.01" y1="6" y2="6" />
    <line x1="6" x2="6.01" y1="18" y2="18" />
  </g>

  <!-- Internet -->
  <path class="dg-machine" transform="translate(-36 8)" d="M636 70a16 16 0 0 1 -2 -31.9a22 22 0 0 1 42 -9a17 17 0 0 1 26 14a13.5 13.5 0 0 1 -2 26.9z"/>

  <!-- Labels: each centred under its object. A line stops short of a label it would cross. -->
  <text class="dg-halo" x="290" y="98">Hole app</text>
  <text class="dg-halo" x="632" y="98">Internet</text>
  <text x="168" y="202">TUN device</text>
  <text x="290" y="202">Hole bridge</text>
  <text x="404" y="202">Plugin</text>
  <text x="632" y="202">Shadowsocks server</text>
  <text class="dg-area" x="235" y="226">Your computer</text>
</svg>
