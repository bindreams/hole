<svg class="diagram" viewBox="0 0 736 98" role="img" xmlns="http://www.w3.org/2000/svg"
     aria-label="A lookup goes from the app to the operating system, into the TUN device and to Hole's DNS forwarder. The forwarder sends it through the encrypted tunnel to the Shadowsocks server, which passes it to the resolver.">
