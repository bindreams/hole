  <rect class="dg-frame" x="482" y="12" width="246" height="128" rx="10"/>

  <!-- Shadowsocks traffic, wrapped between the two plugins -->
  <path class="dg-tunnel-back" d="M216 48H520V64H216Z"/>
  <path class="dg-tunnel" d="M216 48H520V64H216Z"/>
  <path class="dg-line" d="M84 56H652"/>

