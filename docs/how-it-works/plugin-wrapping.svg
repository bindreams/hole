<svg class="diagram" viewBox="0 0 736 148" role="img" xmlns="http://www.w3.org/2000/svg"
     aria-label="On your computer the Shadowsocks client hands its traffic to the plugin. The plugin wraps it, for example in WebSocket over TLS, and sends it to the server, where a matching plugin unwraps it and hands it to the Shadowsocks server.">
