[package]
name = "util"
version = "0.1.0"
edition.workspace = true
publish = false
license = "Apache-2.0"
description = "Small cross-platform workspace utilities (ephemeral port allocation, retry-with-backoff). Apache-2.0 so both Hole's GPL crates and the Apache plugin world (garter/galoshes/plugin-e2e) can depend on it without license friction."

[lints]
workspace = true

[lib]
harness = false

[dependencies]
bitflags = { workspace = true }
tokio = { version = "1", features = ["rt", "macros", "time", "net"] }
tracing = "0.1"
# Redaction registry: lock-free snapshot reads so no logging call can block
# behind a concurrent arm, and multi-needle leftmost-longest byte search.
arc-swap = "1"
aho-corasick = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Networking_WinSock", "Win32_System_IO"] }

[dev-dependencies]
skuld = { workspace = true }
hole-test-observability = { path = "../test-observability" }
# `redact_tests` asserts on what `arm` itself logs: `WaitableWriter` as the
# capture target (garter's `test-utils` feature) and the mandated
# current-thread subscriber installer. garter does not depend on `util`, so
# this is not a cycle.
garter = { path = "../garter", features = ["test-utils"] }
tracing-subscriber = { version = "0.3", features = ["fmt"] }
# `retry_tests` uses `tokio::time::pause()` to auto-advance the mock clock
# instead of burning wall-clock seconds on exponential backoff.
tokio = { version = "1", features = ["test-util"] }
