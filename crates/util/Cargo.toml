[package]
name = "util"
version = "0.1.0"
edition.workspace = true
publish = false
license = "Apache-2.0"
description = "Small cross-platform workspace utilities (ephemeral port allocation, retry-with-backoff). Apache-2.0 so both Hole's GPL crates and the Apache plugin world (garter/galoshes/plugin-e2e) can depend on it without license friction."

[lints]
workspace = true

[features]
# `versioned_file`'s file-system seam (`Fs`, `VersionedFile::with_fs`), so a
# downstream crate's tests can fail a read or a link under its own state file.
# Off by default; enable it only under `[dev-dependencies]`.
test-support = []

[lib]
harness = false

[dependencies]
bitflags = { workspace = true }
# `parse_error`: classifying a parse failure needs the error type it classifies.
# `raw_value`: `versioned_file` reads the `version` token's text, because a
# float cannot tell `18446744073709551616` from `1e20`.
serde_json = { workspace = true, features = ["raw_value"] }
# `versioned_file`: schema chain decoding, plus the typed errors around it.
serde = { workspace = true }
thiserror = "2"
tokio = { version = "1", features = ["rt", "macros", "time", "net"] }
tracing = "0.1"
# Redaction registry: lock-free snapshot reads so no logging call can block
# behind a concurrent arm, and multi-needle leftmost-longest byte search.
arc-swap = "1"
aho-corasick = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# `Win32_Foundation`, `Win32_Storage_FileSystem`: `versioned_file`'s POSIX-semantics
# replace (with its `MoveFileExW` fallback) and no-clobber rename. `dir` opens and
# renames relative to a directory handle with `NtCreateFile` / `NtSetInformationFile`
# (`Wdk_Storage_FileSystem`, whose `OBJECT_ATTRIBUTES` needs `Wdk_Foundation` and `Win32_Security`).
windows = { version = "0.62", features = ["Wdk_Foundation", "Wdk_Storage_FileSystem", "Win32_Foundation", "Win32_Networking_WinSock", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_SystemInformation"] }

[dev-dependencies]
skuld = { workspace = true }
tempfile = "3"
hole-test-observability = { path = "../test-observability" }
# `redact_tests` asserts on what `arm` itself logs: `WaitableWriter` as the
# capture target (garter's `test-utils` feature) and the mandated
# current-thread subscriber installer. garter does not depend on `util`, so
# this is not a cycle.
garter = { path = "../garter", features = ["test-utils"] }
tracing-subscriber = { version = "0.3", features = ["fmt"] }
# `retry_tests` uses `tokio::time::pause()` to auto-advance the mock clock
# instead of burning wall-clock seconds on exponential backoff.
tokio = { version = "1", features = ["test-util"] }
# `versioned_file`'s compile-fail fixtures pin that a gap in a migration chain
# does not build.
trybuild = { workspace = true }

[target.'cfg(windows)'.dev-dependencies]
# The ACL read-back in `dir/windows_tests.rs`.
windows = { version = "0.62", features = ["Win32_Security_Authorization"] }
