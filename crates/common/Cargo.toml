[package]
name = "hole-common"
version = "0.6.0"
edition = "2021"
publish = false

[package.metadata.hole-release]
group = "hole"

[lints]
workspace = true

[lib]
harness = false

[features]
# Passthrough to tombstone's dev-only minidump writer. NON-DEFAULT; only
# dev/test build paths (build.yaml hole / hole-tests) enable it. See #438.
crash-dumps = ["tombstone/crash-dumps"]

[dependencies]
cosca = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
thiserror = "2"
sha2 = "0.11"
minisign-verify = "0.2"
uuid = { version = "1", features = ["v4", "serde"] }
# A-label form of a configured IDN hostname, so redaction covers what a
# third-party dialer logs rather than only what the user typed.
idna = "1"
dirs = "6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "ansi"] }
tracing-log = "0.2"
tracing-appender = "0.2"
file-rotate = "0.8"
os_pipe = "1"
time = { version = "0.3", features = ["serde-well-known", "formatting", "macros"] }
tokio = { version = "1", features = ["rt", "macros", "time", "net"] }
yaml_serde = "0.10"
nu-ansi-term = "0.50"
tempfile = "3"
tombstone = { path = "../tombstone" }
util = { path = "../util" }
# `Dump` impls for the config containers: the `dump!` ladder resolves per
# top-level expression, so a container without one falls to `Serialize` and
# renders the address and the password in clear.
dump = { path = "../dump" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_Threading",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
typify = "0.7"
# NOT ours to choose. `build.rs` names `schemars::schema::Schema` only to feed
# `typify::TypeSpace`, and typify does not re-export schemars, so this must be
# the series typify speaks — `typify-impl` requires `^0.8.22`. 0.9 and 1.x both
# made the `schema` module private, so a bump fails the build script with E0603
# (#379, closed as upstream-blocked; oxidecomputer/typify#886 upstream) — that
# compile failure is the real enforcement, unconditionally. See
# xtask/src/schemars_pin.rs's module doc (PINNED_SERIES) for what keeps this
# line, that doc, and .github/renovate.json's allowedVersions rule in sync.
schemars = "0.8"
serde_json = "1"
yaml_serde = "0.10"

[dev-dependencies]
skuld = { workspace = true }
# Compile-fail probes pinning that `Password`/`ServerAddress` cannot grow a
# second exit (`Display`, `Deref`). See `tests/secret_shape/`.
trybuild = { workspace = true }
hole-test-observability = { path = "../test-observability" }
log = "0.4"
tokio = { version = "1", features = ["test-util"] }
garter = { path = "../garter" }
