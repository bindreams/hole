[package]
name = "tun-engine"
version = "0.5.0"
edition = "2021"
publish = false
description = "Cross-platform TUN device, OS routing, gateway discovery, and a smoltcp-backed packet-loop engine for building split-tunnel VPN/proxy daemons."
readme = "README.md"
repository = "https://github.com/bindreams/hole"
license = "GPL-3.0-or-later"
keywords = ["tun", "tun2socks", "vpn", "smoltcp", "routing"]
categories = ["network-programming"]

[package.metadata.hole-release]
group = "hole"

[lints]
workspace = true

[features]
# Exposes the `sim` module — in-memory doubles for engine-owned types
# that have no constructor outside this crate — and the `test_utils` module,
# the harness the privileged (elevated) test lanes share: shelled-out command
# diagnostics, a probe route owned by an RAII guard, the escape from a
# fail-closed cover, and (Windows only) the pktmon wire-capture oracle for an
# unconnected UDP `send_to`. Off by default — enabled by this crate's own
# tests via `cfg(test)` and by downstream crates that need to drive the
# router without an OS device (`hole-bridge`, via a dev-dependency).
# Production builds do NOT enable it, so none of these modules are compiled
# into them. Same shape as garter's `test-utils`.
test-utils = ["dep:rand"]

[lib]
harness = false

[dependencies]
tun-engine-macros = { path = "../tun-engine-macros" }
util = { path = "../util" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
default-net = "0.22"
socket2 = "0.6"
tempfile = "3"
bytes = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "io-util", "net", "time"] }
tokio-util = "0.7"
tokio-socks = "0.5"
async-trait = "0.1"
arc-swap = "1"
# Pinned to the same versions shadowsocks-service 1.24 uses transitively
# (via tun-0.8.6) so cargo deduplicates the crates.
tun = { version = "0.8", features = ["async"] }
smoltcp = { version = "0.13", default-features = false, features = [
    "alloc",
    "medium-ip", "proto-ipv4", "proto-ipv6",
    "socket-tcp", "socket-udp",
    # Hold a listener in SynReceived so the accept verdict precedes the SYN-ACK.
    "socket-tcp-pause-synack",
] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_NetworkManagement_WindowsFilteringPlatform",
    "Win32_Networking_WinSock",
    # FWPM filter/value/condition structs (FWPM_FILTER0, FWP_VALUE0,
    # FWP_CONDITION_VALUE0) and FwpmFilterAdd0 are gated behind Win32_Security.
    "Win32_Security",
    # RPC_C_AUTHN_WINNT for FwpmEngineOpen0's session auth.
    "Win32_System_Rpc",
] }
# Pinned to the same minor version that shadowsocks-service 1.24 uses
# transitively (via tun-0.8.6) so cargo deduplicates the crate.
wintun-bindings = "0.7"
# Nonce generation for `test_utils::pktmon` — optional, pulled in only by the
# `test-utils` feature (see the feature's own comment). Version pinned to
# match `hole-bridge`'s own `rand` dependency, which the same module's twin in
# `cutover_nic_capture_privileged.rs` used before promotion.
rand = { version = "0.10", optional = true }

[dev-dependencies]
skuld = { workspace = true }
hole-test-observability = { path = "../test-observability" }
# Recovery-path redaction tests capture tracing output through a
# `RedactingWriter`: `WaitableWriter` (garter's `test-utils` feature) as the
# sink, plus the mandated current-thread subscriber installer. garter does
# not depend on tun-engine, so this is not a cycle.
garter = { path = "../garter", features = ["test-utils"] }
tracing-subscriber = { version = "0.3", features = ["fmt"] }

[target.'cfg(target_os = "windows")'.dev-dependencies]
# `test_utils::pktmon` compiles under bare `cfg(test)` (this crate's own
# privileged tests use it without needing the `test-utils` feature on) — same
# gate as `test_utils` itself. The `[dependencies]` entry above only covers
# the OTHER edge: a downstream crate (`hole-bridge`) depending on this crate
# with the `test-utils` feature turned on, where dev-dependencies never leak.
rand = "0.10"
