[package]
name = "file-lock"
version = "0.1.0"
edition.workspace = true
publish = false
license = "GPL-3.0-or-later"
description = "Cross-process exclusive file lock (flock / LockFileEx), hardened for a directory another principal can write."

[lints]
workspace = true

[lib]
harness = false

[dependencies]
tracing = "0.1"
util = { path = "../util" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# `LockFileEx` (`Win32_Storage_FileSystem`) and the `OVERLAPPED` it takes (`Win32_System_IO`).
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO"] }

[dev-dependencies]
skuld = { workspace = true }
# `util::dir::testing`: the links and folders a test of the walk needs.
util = { path = "../util", features = ["test-support"] }
hole-test-observability = { path = "../test-observability" }
tempfile = "3"
