[package]
name = "dev-console"
version = "0.1.0"
edition.workspace = true
publish = false
license = "GPL-3.0-or-later"
description = "Dev-mode supervisor: runs bridge (elevated) + Vite + GUI with multiplexed colored logs. Builds nothing — the xtask cascade does."

[lints]
workspace = true

[lib]
harness = false

[[bin]]
name = "dev-console"
path = "src/main.rs"

[dependencies]
anstream = "1" # strip ANSI when writing the dev-console.log transcript
anyhow = { workspace = true }
chrono = { version = "0.4", default-features = false, features = ["clock"] } # local timestamp for the dev-run dir
futures-util = { version = "0.3", default-features = false, features = ["std"] } # catch_unwind for the teardown funnel
cosca = { workspace = true, features = ["tokio"] }
stepstool = { path = "../stepstool" }
util = { path = "../util" }
xtask-lib = { path = "../../xtask-lib" }
rand = "0.10" # match the bridge's pin (crates/bridge/Cargo.toml)
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "signal", "io-std", "io-util", "net", "sync", "time"] }
which = "8" # performs Windows PATHEXT resolution (the npm.cmd trap)

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
skuld = { workspace = true }
hole-test-observability = { path = "../test-observability" }
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }

[target.'cfg(windows)'.dev-dependencies]
windows = { version = "0.62", features = ["Win32_System_Console"] } # console-corruption check
