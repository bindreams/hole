name: Draft Release (ex-ray)

# Thin caller for the shared draft-release reusable workflow.
# ex-ray uses plain semver only (X.Y.Z), no pre-release/lineage suffix.

on:
  workflow_dispatch:
    inputs: &inputs
      version:
        description: "ex-ray release version (e.g. 0.1.0)"
        required: true
        type: string
  workflow_call:
    inputs: *inputs

jobs:
  draft:
    permissions:
      contents: write
    uses: ./.github/workflows/reusable-draft-release.yaml
    with:
      track: ex-ray
      version: ${{ inputs.version }}
      version-regex: '^[0-9]+\.[0-9]+\.[0-9]+$'
      cargo-version-group: ex-ray
      release-title: ex-ray v${{ inputs.version }}
      latest: false
