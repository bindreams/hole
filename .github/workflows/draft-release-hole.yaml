name: Draft Release (hole)

# Thin caller for the shared draft-release reusable workflow.
# Hole is the user-facing product and the only track that claims /releases/latest.

on:
  workflow_dispatch:
    inputs: &inputs
      version:
        description: "hole release version (e.g. 1.0.0)"
        required: true
        type: string
  workflow_call:
    inputs: *inputs

jobs:
  draft:
    permissions:
      contents: write
    uses: ./.github/workflows/reusable-draft-release.yaml
    with:
      track: hole
      version: ${{ inputs.version }}
      version-regex: '^[0-9]+\.[0-9]+\.[0-9]+$'
      cargo-version-group: hole
      release-title: hole v${{ inputs.version }}
      latest: true
