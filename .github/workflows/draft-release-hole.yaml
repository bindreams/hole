name: Draft Release (hole)

on:
  workflow_dispatch:
    inputs: &inputs
      version:
        description: "hole release version (e.g. 1.0.0)"
        required: true
        type: string
  workflow_call:
    inputs: *inputs

permissions:
  contents: write

jobs:
  validate:
    name: Validate version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so the ancestry check can resolve origin/main.
          fetch-depth: 0

      - uses: ./.github/actions/setup-rust

      # `workflow_dispatch` accepts --ref, so without this a draft can be pinned to unmerged code and every
      # later check still passes.
      - name: Verify the release commit is on main
        env:
          SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --quiet origin main

          set +e
          git merge-base --is-ancestor "$SHA" origin/main
          STATUS=$?
          set -e

          case "$STATUS" in
            0) echo "$SHA is an ancestor of origin/main" ;;
            1)
              echo "::error::$SHA is not an ancestor of origin/main. Release only from merged commits."
              exit 1
              ;;
            *)
              echo "::error::git merge-base failed (exit $STATUS); cannot confirm $SHA is on main"
              exit 1
              ;;
          esac

      - name: Normalize and validate version
        id: version
        run: |
          V="${{ inputs.version }}"
          V="${V#v}"
          [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Invalid version: '${{ inputs.version }}'"; exit 1; }
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Create local tag for build
        run: git tag "releases/hole/v${{ steps.version.outputs.version }}"

      - name: Fetch crate sources
        run: .github/scripts/cargo-fetch.sh

      - name: Validate Cargo.toml matches version
        run: cargo xtask version --check --exact --group hole

      # The platforms the release notes' Downloads table lists.
      - name: Define build matrix
        id: matrix
        run: |
          echo 'matrix=[{"os":"windows","arch":"amd64","runner":"windows-latest","ext":"msi"},{"os":"darwin","arch":"arm64","runner":"macos-latest","ext":"dmg"},{"os":"darwin","arch":"amd64","runner":"macos-15-intel","ext":"dmg"}]' >> "$GITHUB_OUTPUT"

  # CI's whole test track on the release commit, with the release tag created locally so the binaries
  # carry the release version. Each leg stages the files it ships after their tests and uploads them
  # as `release-<os>-<arch>` (ci.yaml, "Release assets"); no draft exists unless every leg passed.
  ci:
    name: CI
    needs: validate
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yaml
    with:
      release-tag: releases/hole/v${{ needs.validate.outputs.version }}

  release:
    name: Create draft release
    needs: [validate, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true

      # Hash on ubuntu (single platform) so SHA256SUMS is uniformly
      # text-mode regardless of which per-matrix runner built each
      # artifact. Git-Bash sha256sum on Windows defaults to binary mode
      # (asterisk marker), macOS defaults to text mode; hashing here
      # avoids that divergence entirely. See #355.
      - name: Compute SHA256SUMS
        run: |
          sha256sum hole-* > SHA256SUMS

          lines=$(wc -l < SHA256SUMS)
          if [ "$lines" -ne 6 ]; then
            echo "::error::Expected 6 entries in SHA256SUMS (3 installers + 3 archives), got $lines"
            exit 1
          fi

          echo "SHA256SUMS:"
          cat SHA256SUMS

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # `path: source` so we don't clobber the downloaded artifacts in $GITHUB_WORKSPACE.
          path: source

      - uses: astral-sh/setup-uv@v10.3.3

      - name: Generate per-track release notes
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          TAG="releases/hole/v${VERSION}"
          # Fetch the script's dependencies under retry.
          source/.github/scripts/retry.sh uv run source/scripts/generate-release-notes.py --help
          uv run source/scripts/generate-release-notes.py hole \
            --new-tag "$TAG" \
            --head "${{ github.sha }}" \
            --repo-root source \
            --platforms '${{ needs.validate.outputs.matrix }}' \
            --version "$VERSION" \
            > release-notes.md
          echo "--- release-notes.md ---"
          cat release-notes.md
          echo "--- end ---"

      # Hole is the user-facing product and is the canonical holder of
      # /releases/latest. Pinning --latest=true at draft-create time
      # means make_latest is set through the draft→publish lifecycle
      # and doesn't depend on GitHub's legacy semver+date heuristic.
      # The other three tracks pass --latest=false. See #308.
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          TAG="releases/hole/v${VERSION}"
          gh release create "$TAG" \
            --draft \
            --latest=true \
            --notes-file release-notes.md \
            --title "hole v${VERSION}" \
            --target "${{ github.sha }}" \
            hole-* SHA256SUMS
          echo "Draft release created: https://github.com/${{ github.repository }}/releases/tag/$TAG"
