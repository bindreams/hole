name: Vendor bump

on:
  push:
    branches: ["renovate/**"]
    paths: ["crates/ex-ray/third_party/*/.gitrepo"]
  pull_request:
    types: [opened, synchronize]
    paths: ["crates/ex-ray/third_party/*/.gitrepo"]
  workflow_dispatch:
    inputs:
      dep:
        description: Vendored dep directory name under crates/ex-ray/third_party (e.g. v2ray-core, utls)
        required: true
      tag:
        description: Upstream tag to pull (e.g. v5.53.0)
        required: true

permissions:
  contents: write
  pull-requests: write

concurrency:
  # `cancel-in-progress: false` does not mean "queue everything": when a
  # new run is queued while another in the same group is in progress, the
  # new one becomes pending, and any *previously pending* run in that
  # group is cancelled — only one pending run survives per group. `bump`'s
  # own push fires both a `push` event (a new `bump` run, skipped early by
  # the self-retrigger guard but still occupying a concurrency slot) and a
  # `pull_request: synchronize` event (an `arm-on-pr-open` run) — webhook
  # delivery order between the two isn't guaranteed, so putting both event
  # types in the same group risks `arm-on-pr-open` getting evicted before
  # it ever starts. `bump` and `arm-on-pr-open` runs are kept in separate
  # groups (prefixed by event type) so neither can evict the other;
  # `github.head_ref` (pull_request) and `github.ref_name` (push) are both
  # already the bare branch name.
  # `github.head_ref` is empty for `workflow_dispatch`, so the final
  # fallback there is `inputs.dep` (not `github.ref_name`, which is
  # whatever ref the dispatch was launched against — normally `main` for
  # every manual run, which would collapse all concurrent manual bumps for
  # different deps into one group); `inputs.dep` is empty on `push`, so
  # that event still falls through to `github.ref_name` as before.
  group: vendor-bump-${{ github.event_name == 'pull_request' && 'arm' || 'bump' }}-${{ github.head_ref || inputs.dep || github.ref_name }}
  cancel-in-progress: false

jobs:
  bump:
    name: Pull + rebase vendored dependency
    if: github.event_name != 'pull_request' && (github.event_name != 'push' || github.event.head_commit.author.name != 'nathan-blahaj[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # `uses: ./...` (below) resolves against the checked-out workspace,
      # which is empty at job start — this bootstrap checkout exists only
      # to make the local mint-nathan-token action resolvable. The real
      # checkout follows once the token exists.
      - uses: actions/checkout@v7

      - name: Mint nathan-blahaj token
        id: nathan
        uses: ./.github/actions/mint-nathan-token
        with:
          app-id: ${{ secrets.NATHAN_APP_ID }}
          private-key: ${{ secrets.NATHAN_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.nathan.outputs.token }}

      - name: Ensure origin/main is available
        run: git fetch origin main --quiet

      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v7
        with:
          go-version: stable

      # git-subrepo isn't part of the ubuntu-latest image or any
      # apt/npm/go package — it's a bash-script tool installed by cloning
      # it and putting its lib/ dir (containing an executable named
      # `git-subrepo`) on PATH. Pinned to 0.4.9 to match the version this
      # workflow's fixup logic targets.
      - name: Install git-subrepo 0.4.9
        run: |
          git clone --branch 0.4.9 --depth 1 https://github.com/ingydotnet/git-subrepo "$RUNNER_TEMP/git-subrepo"
          echo "$RUNNER_TEMP/git-subrepo/lib" >> "$GITHUB_PATH"

      - name: Determine dep + tag
        id: target
        env:
          INPUT_DEP: ${{ inputs.dep }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [[ -n "$INPUT_DEP" ]]; then
            dep="$INPUT_DEP"
            tag="$INPUT_TAG"
          else
            changed=$(git diff --name-only origin/main...HEAD -- 'crates/ex-ray/third_party/*/.gitrepo')
            if [[ -z "$changed" ]]; then
              count=0
            else
              count=$(printf '%s\n' "$changed" | wc -l)
            fi
            if [[ "$count" -ne 1 ]]; then
              echo "::error::expected exactly one changed .gitrepo relative to main, got $count: $changed"
              exit 1
            fi
            dep=$(basename "$(dirname "$changed")")
            tag=$(sed -n 's/^\tbranch = //p' "$changed")
          fi

          # No leading `-`: besides the injection-safety this shares with
          # every other character class here, a leading `-` would let
          # `dep`/`tag` be parsed as a flag by the `cargo xtask` calls below
          # instead of a positional — defense in depth alongside the `--`
          # separator those calls also use.
          if ! [[ "$dep" =~ ^[a-zA-Z0-9_.][a-zA-Z0-9_.-]*$ ]]; then
            echo "::error::invalid dep name: $dep"
            exit 1
          fi
          if ! [[ "$tag" =~ ^[a-zA-Z0-9_.][a-zA-Z0-9_.-]*$ ]]; then
            echo "::error::invalid tag: $tag"
            exit 1
          fi

          echo "dep=$dep" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "path=crates/ex-ray/third_party/$dep" >> "$GITHUB_OUTPUT"

      - name: Create a scratch branch (workflow_dispatch only)
        if: github.event_name == 'workflow_dispatch'
        id: scratch-branch
        run: |
          branch="vendor-bump-manual/${{ steps.target.outputs.dep }}-${{ steps.target.outputs.tag }}-${{ github.run_id }}"
          git checkout -b "$branch"
          echo "ref_name=$branch" >> "$GITHUB_OUTPUT"

      - name: git identity
        run: |
          git config user.name "nathan-blahaj[bot]"
          git config user.email "nathan-blahaj[bot]@users.noreply.github.com"

      - name: Pull the vendored subrepo
        id: pull
        run: |
          set +e
          cargo xtask pull-subrepo -- "${{ steps.target.outputs.path }}" "${{ steps.target.outputs.tag }}"
          code=$?
          set -e
          if [[ "$code" -eq 0 ]]; then
            echo "result=clean" >> "$GITHUB_OUTPUT"
          elif [[ "$code" -eq 2 ]]; then
            echo "result=conflicted" >> "$GITHUB_OUTPUT"
          else
            exit "$code"
          fi

      - name: Finish (version note, go.mod, identity checks)
        id: finish
        if: steps.pull.outputs.result == 'clean'
        continue-on-error: true
        run: cargo xtask finish-vendor-bump -- "${{ steps.target.outputs.path }}" "${{ steps.target.outputs.dep }}" "${{ steps.target.outputs.tag }}"

      - name: Commit the conflicted tree anyway (CI-only policy — see VENDORING.md)
        if: steps.pull.outputs.result == 'conflicted'
        run: cargo xtask force-commit-conflicted-subrepo -- "${{ steps.target.outputs.path }}" "${{ steps.target.outputs.tag }}"

      - name: Push
        if: steps.pull.outputs.result == 'clean' || steps.pull.outputs.result == 'conflicted'
        run: git push origin "HEAD:${{ steps.scratch-branch.outputs.ref_name || github.ref_name }}"

      # The single source of truth for "is this pushed commit actually
      # ready to merge" — arm-on-pr-open (below) queries this same
      # check-run instead of re-deriving the answer, and it's a required
      # status check (a required branch-ruleset check) so GitHub's own
      # merge gate enforces it too, independent of either arming path.
      # Reported *before* "Find the PR" below: arm-on-pr-open's own PR-open
      # run queries this check-run to decide whether to arm, so if
      # Renovate's PR-creation call lands in the gap between these two
      # steps, posting the check first guarantees whichever job observes
      # the PR second still sees a decision it can act on — the reverse
      # order leaves a window where neither job arms.
      - name: Report vendor-bump-ready check for the pushed commit
        if: steps.pull.outputs.result == 'clean' || steps.pull.outputs.result == 'conflicted'
        env:
          GH_TOKEN: ${{ steps.nathan.outputs.token }}
        run: |
          sha=$(git rev-parse HEAD)
          # `output[title]`/`output[summary]` (below) put the reason on the
          # check-run itself rather than only on a PR comment — Renovate's
          # own PR-creation rate limiting means no PR may exist yet to
          # comment on (see the "Note if no PR exists yet" step), and the
          # check-run is always postable on this exact commit regardless.
          if [[ "${{ steps.pull.outputs.result }}" == "clean" && "${{ steps.finish.outcome }}" == "success" ]]; then
            conclusion=success
            title="Vendor bump ready"
            summary="Pulled \`${{ steps.target.outputs.dep }}\` to \`${{ steps.target.outputs.tag }}\` cleanly; identity checks passed."
          elif [[ "${{ steps.pull.outputs.result }}" == "conflicted" ]]; then
            conclusion=failure
            title="Merge conflict outside the auto-resolved allowlist"
            summary=$(cat <<EOF
          Automated pull of \`${{ steps.target.outputs.dep }}\` to \`${{ steps.target.outputs.tag }}\` hit a real merge conflict outside the auto-resolved allowlist (go.mod/go.sum/.github/workflows). The conflicted tree is committed on this branch, alongside a \`.vendor-conflict\` sentinel file listing every conflicted path.

          To resolve: check out this branch, fix the conflicts (every path the sentinel lists), then run \`cargo xtask finish-vendor-bump crates/ex-ray/third_party/${{ steps.target.outputs.dep }} ${{ steps.target.outputs.dep }} ${{ steps.target.outputs.tag }}\` and push a normal commit — it clears the sentinel once it confirms every listed path was actually touched, or fails naming the one that wasn't. If you'd rather redo the pull locally instead of editing the committed conflict markers in place, discard this commit and run \`cargo xtask pull-subrepo\`; if you resolve the resulting conflict by hand and fold it in yourself with a raw \`git subrepo commit\` (see its own printed instructions), run it as \`SKIP=check-vendoring-integrity git subrepo commit <path>\` if this repo's git hooks are installed locally.
          EOF
          )
          else
            conclusion=failure
            title="Finish step failed"
            summary="Pulled \`${{ steps.target.outputs.dep }}\` to \`${{ steps.target.outputs.tag }}\` cleanly, but the Finish step (version note, go.mod, identity checks) failed — see this run's own job log for the reason."
          fi
          gh api "repos/${{ github.repository }}/check-runs" -X POST \
            -f name="vendor-bump-ready" \
            -f head_sha="$sha" \
            -f status=completed \
            -f conclusion="$conclusion" \
            -f "output[title]=$title" \
            -f "output[summary]=$summary"

      - name: Find the PR for this branch
        if: github.event_name == 'push' && (steps.pull.outputs.result == 'clean' || steps.pull.outputs.result == 'conflicted')
        id: find-pr
        env:
          GH_TOKEN: ${{ steps.nathan.outputs.token }}
        run: |
          pr_number=$(gh pr list --repo "${{ github.repository }}" --head "${{ github.ref_name }}" --json number --jq '.[0].number // empty')
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"

      # `--match-head-commit` makes a Renovate force-push racing this call a
      # no-op instead of arming a moved-on head — but `gh` still exits
      # non-zero on that rejection, indistinguishable by exit code alone
      # from a real failure (e.g. auto-merge not permitted). On failure,
      # re-querying the PR distinguishes three outcomes: head moved on
      # (`arm-on-pr-open`'s next `synchronize` run will arm it instead),
      # the PR was independently closed/merged (nothing to arm), or neither
      # — a genuine error, failed loudly. The diagnostic query itself is
      # guarded too (this `run:` block executes under bash `-e` like every
      # other step here), so its own transient failure gets a crafted
      # message instead of a bare shell abort.
      - name: Arm auto-merge
        if: steps.pull.outputs.result == 'clean' && steps.finish.outcome == 'success' && steps.find-pr.outputs.pr_number != ''
        env:
          GH_TOKEN: ${{ steps.nathan.outputs.token }}
        run: |
          sha=$(git rev-parse HEAD)
          pr="${{ steps.find-pr.outputs.pr_number }}"
          if gh pr merge --auto --squash --match-head-commit "$sha" "$pr" --repo "${{ github.repository }}"; then
            exit 0
          fi
          if ! pr_info=$(gh pr view "$pr" --repo "${{ github.repository }}" --json headRefOid,state --jq '[.headRefOid, .state] | @tsv'); then
            echo "::error::gh pr merge failed for PR #$pr, and the follow-up gh pr view to diagnose why also failed — see the output above for both"
            exit 1
          fi
          current_head=$(printf '%s' "$pr_info" | cut -f1)
          state=$(printf '%s' "$pr_info" | cut -f2)
          if [[ "$current_head" != "$sha" ]]; then
            echo "::notice::PR #$pr's head moved from $sha to $current_head before arming — arm-on-pr-open will catch up on the next synchronize event"
            exit 0
          fi
          if [[ "$state" == "CLOSED" || "$state" == "MERGED" ]]; then
            echo "::notice::PR #$pr is already $state — nothing to arm"
            exit 0
          fi
          echo "::error::gh pr merge failed while PR #$pr was still open with head $sha — a genuine error, see the output above"
          exit 1

      # Renovate's prHourlyLimit/prConcurrentLimit (both left at defaults
      # here) deliberately create the branch and defer PR creation — this
      # is common, not a narrow race. The arm-on-pr-open job below is the
      # guaranteed catch-up; this is just visibility for the common
      # opportunistic-arm-skipped case.
      - name: Note if no PR exists yet
        if: github.event_name == 'push' && steps.pull.outputs.result == 'clean' && steps.finish.outcome == 'success' && steps.find-pr.outputs.pr_number == ''
        run: echo "::notice::No open PR found yet for this branch — auto-merge will be armed by this workflow's pull_request trigger once Renovate opens it."

      - name: Comment on the PR if conflicted
        if: steps.pull.outputs.result == 'conflicted' && steps.find-pr.outputs.pr_number != ''
        env:
          GH_TOKEN: ${{ steps.nathan.outputs.token }}
        run: |
          gh pr comment "${{ steps.find-pr.outputs.pr_number }}" --repo "${{ github.repository }}" --body "$(cat <<EOF
          Automated pull of \`${{ steps.target.outputs.dep }}\` to \`${{ steps.target.outputs.tag }}\` hit a real merge conflict outside the auto-resolved allowlist (go.mod/go.sum/.github/workflows). The conflicted tree is committed on this branch, alongside a \`.vendor-conflict\` sentinel file listing every conflicted path.

          To resolve: check out this PR branch, fix the conflicts (every path the sentinel lists), then run \`cargo xtask finish-vendor-bump crates/ex-ray/third_party/${{ steps.target.outputs.dep }} ${{ steps.target.outputs.dep }} ${{ steps.target.outputs.tag }}\` and push a normal commit — it clears the sentinel once it confirms every listed path was actually touched, or fails naming the one that wasn't. If you'd rather redo the pull locally instead of editing the committed conflict markers in place, discard this commit and run \`cargo xtask pull-subrepo\`; if you resolve the resulting conflict by hand and fold it in yourself with a raw \`git subrepo commit\` (see its own printed instructions), run it as \`SKIP=check-vendoring-integrity git subrepo commit <path>\` if this repo's git hooks are installed locally.
          EOF
          )"

      - name: Fail the job if Finish failed
        if: steps.finish.outcome == 'failure'
        run: |
          echo "::error::the 'Finish' step failed — see its log above for the reason (an identity-check failure, or an earlier error like a malformed go.mod/VENDORING.md heading). Any commits it made before failing were still pushed."
          exit 1

  arm-on-pr-open:
    name: Arm auto-merge (PR opened/updated)
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'renovate/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # `uses: ./...` (below) resolves against the checked-out workspace,
      # which is empty at job start — this checkout exists only to make
      # the local mint-nathan-token action resolvable. This job runs no
      # git commands of its own (only `gh api`/`gh pr merge` against the
      # minted token), so no `fetch-depth`/`token` override is needed.
      - uses: actions/checkout@v7

      - name: Mint nathan-blahaj token
        id: nathan
        uses: ./.github/actions/mint-nathan-token
        with:
          app-id: ${{ secrets.NATHAN_APP_ID }}
          private-key: ${{ secrets.NATHAN_APP_PRIVATE_KEY }}

      # Only `bump`'s own vendor-bump-ready check-run (not merely who
      # authored the head commit — a conflicted or partially-failed bump
      # is also nathan-authored) tells us whether this exact commit is
      # actually ready. `check_name=` filters server-side (the endpoint
      # defaults to 30 results per page, fewer than this repo's per-commit
      # check-run count) and `sort_by(.started_at) | last` picks the most
      # recent report deterministically if `bump` was ever re-run on the
      # same commit (each POST creates a new check-run rather than
      # updating one, and the API's list order isn't documented as sorted).
      - name: Check whether bump reported this commit ready
        id: check-head
        env:
          GH_TOKEN: ${{ steps.nathan.outputs.token }}
        run: |
          conclusion=$(gh api -X GET "repos/${{ github.repository }}/commits/${{ github.event.pull_request.head.sha }}/check-runs?check_name=vendor-bump-ready" --jq '[.check_runs[]] | sort_by(.started_at) | last | .conclusion // empty')
          echo "conclusion=$conclusion" >> "$GITHUB_OUTPUT"

      # Same three-way disambiguation as `bump`'s own arm step (moved-on
      # head / already closed-or-merged / genuine error), including
      # guarding the diagnostic `gh pr view` call's own failure.
      - name: Arm auto-merge
        if: steps.check-head.outputs.conclusion == 'success'
        env:
          GH_TOKEN: ${{ steps.nathan.outputs.token }}
        run: |
          sha="${{ github.event.pull_request.head.sha }}"
          pr="${{ github.event.pull_request.number }}"
          if gh pr merge --auto --squash --match-head-commit "$sha" "$pr" --repo "${{ github.repository }}"; then
            exit 0
          fi
          if ! pr_info=$(gh pr view "$pr" --repo "${{ github.repository }}" --json headRefOid,state --jq '[.headRefOid, .state] | @tsv'); then
            echo "::error::gh pr merge failed for PR #$pr, and the follow-up gh pr view to diagnose why also failed — see the output above for both"
            exit 1
          fi
          current_head=$(printf '%s' "$pr_info" | cut -f1)
          state=$(printf '%s' "$pr_info" | cut -f2)
          if [[ "$current_head" != "$sha" ]]; then
            echo "::notice::PR #$pr's head moved from $sha to $current_head before arming — a later synchronize run will catch up"
            exit 0
          fi
          if [[ "$state" == "CLOSED" || "$state" == "MERGED" ]]; then
            echo "::notice::PR #$pr is already $state — nothing to arm"
            exit 0
          fi
          echo "::error::gh pr merge failed while PR #$pr was still open with head $sha — a genuine error, see the output above"
          exit 1
