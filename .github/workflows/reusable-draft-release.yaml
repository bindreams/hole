name: Reusable Draft Release

# Common scaffolding for the draft-release workflows of "simple"
# tracks: a single binary per platform. Galoshes and garter fit.
#
# The binaries come from ci.yaml: it runs on the release commit and each leg
# stages the binary its tests ran on (`cargo xtask stage-release`). Hole
# and ex-ray have their own draft workflows.
#
# See #321 (introduction) and CLAUDE.md "Releases" for context.

on:
  workflow_call:
    inputs:
      track:
        description: "Release track (galoshes | garter); used in tag, asset, artifact names"
        required: true
        type: string
      version:
        description: "Release version (e.g. 1.0.0)"
        required: true
        type: string
      version-regex:
        description: "Bash extended regex for validating the normalized version"
        required: true
        type: string
      cargo-version-group:
        description: "Group name for `cargo xtask version --check --exact --group <name>`"
        required: true
        type: string
      release-title:
        description: "GitHub release title (e.g. `galoshes v${VERSION}`)"
        required: true
        type: string
      latest:
        description: "Pass to `gh release create --latest`. Use true for hole only"
        required: true
        type: boolean

permissions:
  contents: write

jobs:
  validate:
    name: Validate version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
      platforms: ${{ steps.assets.outputs.platforms }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so the ancestry check can resolve origin/main.
          fetch-depth: 0

      - uses: ./.github/actions/setup-rust

      - uses: ./.github/actions/verify-release-commit-on-main

      - name: Normalize and validate version
        id: version
        run: |
          V="${{ inputs.version }}"
          V="${V#v}"
          V="${V#releases/${{ inputs.track }}/v}"
          if [[ ! "$V" =~ ${{ inputs.version-regex }} ]]; then
            echo "::error::Invalid version: '${{ inputs.version }}' (regex: ${{ inputs.version-regex }})"
            exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Create local tag for build
        run: git tag "releases/${{ inputs.track }}/v${{ steps.version.outputs.version }}"

      - name: Fetch crate sources
        run: .github/scripts/cargo-fetch.sh

      - name: Validate Cargo.toml matches version
        run: cargo xtask version --check --exact --group ${{ inputs.cargo-version-group }}

      # What this release ships, per platform, from the plan `stage-release` stages by.
      - name: List the release assets
        id: assets
        run: echo "platforms=$(cargo xtask release-assets --tag "releases/${{ inputs.track }}/v${{ steps.version.outputs.version }}")" >> "$GITHUB_OUTPUT"

  # CI's whole test track on the release commit, with the release tag created locally so the binaries
  # carry the release version. Each leg stages the binary it tested and uploads it as
  # `release-<os>-<arch>` (ci.yaml, "Release assets"); no draft exists unless every leg passed.
  ci:
    name: CI
    needs: validate
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yaml
    with:
      release-tag: releases/${{ inputs.track }}/v${{ needs.validate.outputs.version }}

  release:
    name: Create draft release
    needs: [validate, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true

      # The files must be exactly what the release ships (`cargo xtask release-assets`): a leg that staged
      # nothing, or something extra, fails here.
      - name: Check the assets are what the release ships
        env:
          PLATFORMS: ${{ needs.validate.outputs.platforms }}
        run: |
          set -euo pipefail
          jq -r '.[].assets[]' <<<"$PLATFORMS" | sort > "$RUNNER_TEMP/expected-assets.txt"
          find . -maxdepth 1 -type f -printf '%f\n' | sort > "$RUNNER_TEMP/actual-assets.txt"
          diff -u "$RUNNER_TEMP/expected-assets.txt" "$RUNNER_TEMP/actual-assets.txt"

      # Hash on ubuntu (single platform) so SHA256SUMS is uniformly
      # text-mode regardless of which per-matrix runner built each
      # artifact. Git-Bash sha256sum on Windows defaults to binary mode
      # (asterisk marker), macOS defaults to text mode; hashing here
      # avoids that divergence entirely. See #355.
      - name: Compute SHA256SUMS
        run: |
          sha256sum ${{ inputs.track }}-* > SHA256SUMS

          echo "SHA256SUMS:"
          cat SHA256SUMS

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          path: source

      - uses: astral-sh/setup-uv@v10.3.3

      - name: Generate per-track release notes
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          TAG="releases/${{ inputs.track }}/v${VERSION}"
          # Fetch the script's dependencies under retry.
          source/.github/scripts/retry.sh uv run source/scripts/generate-release-notes.py --help
          uv run source/scripts/generate-release-notes.py ${{ inputs.track }} \
            --new-tag "$TAG" \
            --head "${{ github.sha }}" \
            --repo-root source \
            --platforms '${{ needs.validate.outputs.platforms }}' \
            --version "$VERSION" \
            > release-notes.md
          echo "--- release-notes.md ---"
          cat release-notes.md
          echo "--- end ---"

      # --latest is pinned at draft-create time to avoid GitHub's
      # legacy semver+date heuristic. See #308.
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          TAG="releases/${{ inputs.track }}/v${VERSION}"
          gh release create "$TAG" \
            --draft \
            --latest=${{ inputs.latest }} \
            --notes-file release-notes.md \
            --title "${{ inputs.release-title }}" \
            --target "${{ github.sha }}" \
            ${{ inputs.track }}-* SHA256SUMS
          echo "Draft release created: https://github.com/${{ github.repository }}/releases/tag/$TAG"
