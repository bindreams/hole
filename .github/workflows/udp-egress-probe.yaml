name: UDP egress probe

on:
  push:
    branches: [azhukova/1376-ntp-probe]

permissions:
  contents: read

jobs:
  probe:
    name: probe (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-latest, macos-15-intel, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/udp-egress-probe.py
      - if: ${{ startsWith(matrix.runner, 'macos') }}
        run: sntp time.apple.com || true
