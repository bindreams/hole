name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # One job per platform, each building, linting and testing everything that
  # platform ships.
  #
  # A leg checks out and provisions once, then runs the lanes its matrix flags
  # select, in a fixed order, on one target dir and one sccache. Every lane step
  # carries `!cancelled()`, so one failing lane hides nothing, and its own
  # `timeout-minutes`, so a hang fails that step and the later lanes still run,
  # instead of running into the job wall, which cancels them (#989). Every lane
  # gates the merge: no `continue-on-error`, and a rerun repeats the whole
  # platform job. The xtask audits that read this file (`ci_platform_coverage`,
  # `ci_timeouts`, `ci_nextest_parity`, `skuld_label_coverage`,
  # `global_net_state_conformance`) address lanes by step id, so ids are API:
  # `hole-*` is the Hole test lane, `installer-*` and `dmg` assemble an
  # installer.
  #
  # ORDER matters, and the audits hold it:
  #   - Everything that rebuilds the ex-ray/galoshes sidecars (plugin-e2e, the
  #     MSI and DMG builds) runs BEFORE `hole-build`. Both sidecars are
  #     `rerun-if-changed` inputs of the `hole` and `galoshes` build scripts, so
  #     rewriting them afterwards makes the test lanes recompile `hole`, uncached
  #     and on macOS as root.
  #   - Windows: every user of loopback (compiles through sccache, tests, the
  #     installer E2E) runs before the TUN lane, which corrupts NDIS loopback
  #     (#200). Only the #999 proof step, the job-level no-compile check, and
  #     uploads follow it.
  #   - macOS: the TUN lane runs as root and leaves root-owned files in
  #     `target/`, so it is the last step that runs a toolchain.
  #
  # LINT: `.github/lint.toml` lists the prek hooks whose verdict depends on the
  # host (today golangci-lint, which type-checks under the host's GOOS). Those
  # run on every leg (`cargo xtask prek platform-dependent`); every other hook
  # runs once, in linux/amd64 (`cargo xtask prek portable`).
  #
  # WALL (`timeout`, per leg): the largest of 1.25 x the sum of the lanes' worst
  # measured steps over 200 runs rounded up to 5m, the longest wall a previous
  # job allowed these lanes, and every step's budget plus its measured start, so
  # its own bound fires before the wall. Step budgets sum to more than the wall,
  # so a leg whose steps all run near their maxima can hit the wall before a late
  # step's own bound. The audit checks only budget <= wall. A wall kill keeps the
  # log and runs the `always()` steps; the lanes after the hung step do not run.
  # The GitHub cap is 360m. Raised only, never tightened
  # (`no_leg_wall_is_below_the_walls_of_the_jobs_it_absorbed`).
  ci:
    name: Build, lint, test (${{ matrix.os }}/${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # `cache-saver` marks the one leg per cargo cache key that saves
          # `~/.cargo` on `main`; the key is the runner OS + rustc commit with no
          # arch, so there is one per OS.
          #
          # Lane flags: `hole` = the Hole workspace builds here (clippy-hole, the
          # `hole-*` lanes); `installer` = MSI; `dmg` = DMG signing;
          # `ex-ray-unit` = ex-ray's Go tests on its build-tagged platforms;
          # `ech` = the ECH-gate Go tests; `portable-lint` = the portable prek
          # hooks and the renovate config check; `frontend` = the Vite bundle and
          # type check.
          - { os: windows, arch: amd64, runner: windows-latest,   timeout: 175, cache-saver: true, hole: true, installer: true, ex-ray-unit: true }
          - { os: windows, arch: arm64, runner: windows-11-arm,   timeout: 90 }
          - { os: darwin,  arch: amd64, runner: macos-15-intel,   timeout: 305, hole: true, dmg: true }
          - { os: darwin,  arch: arm64, runner: macos-latest,     timeout: 155, cache-saver: true, hole: true, dmg: true, ex-ray-unit: true }
          - { os: linux,   arch: amd64, runner: ubuntu-latest,    timeout: 60,  cache-saver: true, portable-lint: true, ech: true, frontend: true }
          - { os: linux,   arch: arm64, runner: ubuntu-24.04-arm, timeout: 60 }
    steps:
      # Provisioning ===================================================================================================
      # Step budgets: 1.25 x the worst measured step, rounded up to 5m; a step
      # that was a whole job keeps that job's budget. Steps measured under 4m get
      # 5m. One number per step, the slowest leg's: the spread within a step is
      # smaller than the margin.

      - id: checkout
        uses: actions/checkout@v7
        timeout-minutes: 10
        with:
          fetch-depth: 0

      - id: setup-python
        uses: actions/setup-python@v7
        timeout-minutes: 5
        with:
          python-version: "3.x"

      - id: setup-uv
        uses: astral-sh/setup-uv@v10.3.0
        timeout-minutes: 5

      - id: setup-build
        uses: ./.github/actions/setup-build
        timeout-minutes: 30
        with:
          save-cache: ${{ matrix.cache-saver == true }}

      - id: cargo-binstall
        uses: cargo-bins/cargo-binstall@v1.25.3
        timeout-minutes: 5

      - id: install-nextest
        name: Install nextest
        timeout-minutes: 5
        shell: bash
        env:
          # Authenticated GitHub API has a 5000 req/h limit; without this,
          # binstall can hit the 60 req/h unauthenticated limit and fall
          # back to `cargo install`, which fails because nextest's
          # `locked-tripwire` crate requires --locked.
          GITHUB_TOKEN: ${{ github.token }}
        run: .github/scripts/retry.sh cargo binstall --no-confirm --locked cargo-nextest

      # `package(xtask)` (run on every leg) drives a real `prek` hook through
      # `pull_subrepo`/`finish_vendor_bump`, and per this repo's policy those
      # tests must not skip on a missing dependency. Go comes from `setup-build`.
      - id: install-prek
        name: Install prek
        timeout-minutes: 5
        shell: bash
        run: .github/scripts/retry.sh uv tool install prek

      # The `validate-docs` hook is a `system` hook whose `uv run` downloads
      # Sphinx when the hook runs, which `prek install-hooks` does not cover.
      # Fetch it here under retry; retrying the lint would retry a docs failure.
      - id: fetch-docs-tools
        name: Fetch docs build tools (portable lint leg)
        if: ${{ matrix.portable-lint == true }}
        timeout-minutes: 5
        shell: bash
        run: .github/scripts/retry.sh uv run scripts/validate-docs.py --fetch-only

      # macOS runners ship only Apple's frozen Bash 3.2.57 on /usr/bin/bash,
      # ahead of Homebrew's on PATH; git-subrepo's `#!/usr/bin/env bash`
      # shebang hard-requires Bash 4+. Linux and Windows (Git for Windows)
      # already ship it.
      - id: install-bash
        name: Install Bash 4+ (macOS only, for git-subrepo)
        if: ${{ matrix.os == 'darwin' }}
        timeout-minutes: 5
        shell: bash
        run: .github/scripts/retry.sh brew install bash

      # The last provisioning step: every later step requires its success, so a
      # broken VM fails once instead of once per lane.
      - id: provision
        name: Install git-subrepo 0.4.9
        timeout-minutes: 5
        shell: bash
        run: |
          .github/scripts/retry.sh git clone --branch 0.4.9 --depth 1 https://github.com/ingydotnet/git-subrepo "$RUNNER_TEMP/git-subrepo"
          echo "$RUNNER_TEMP/git-subrepo/lib" >> "$GITHUB_PATH"

      # Lint ===========================================================================================================

      - id: lint
        name: Lint (platform-independent hooks)
        if: ${{ !cancelled() && steps.provision.outcome == 'success' && matrix.portable-lint == true }}
        timeout-minutes: 10
        shell: bash
        run: cargo xtask prek portable

      # `scripts/*.py` keep their tests inline, and the filenames are
      # hyphenated, so pytest's default `test_*.py` collection finds nothing —
      # which is why sign-release.py's stale asset-count check reached a release
      # unnoticed (#682). `python_files` collects every script rather than a
      # hand-listed set, so a new script's tests run without touching CI.
      - id: lint-release-scripts
        name: Test release scripts
        if: ${{ !cancelled() && steps.provision.outcome == 'success' && matrix.portable-lint == true }}
        timeout-minutes: 5
        shell: bash
        run: |
          # Fetch the test dependencies under retry; retrying the run would retry a test failure.
          with=(--with pytest --with PyYAML --with pathspec)
          .github/scripts/retry.sh uv run "${with[@]}" python -c ""
          uv run "${with[@]}" pytest -o python_files="*.py" scripts/

      - id: lint-platform-dependent
        name: Lint (hooks that depend on the host)
        if: ${{ !cancelled() && steps.provision.outcome == 'success' }}
        timeout-minutes: 5
        shell: bash
        run: cargo xtask prek platform-dependent

      # Renovate npm safety gate: the Vite bundle and the type check are required
      # status checks for npm dependency PRs to automerge (see
      # .github/renovate.json). `npm run check` and `vite build` are platform-
      # independent; the per-OS Tauri shell is exercised by the release pipeline.
      - id: frontend-build
        name: Build frontend
        if: ${{ !cancelled() && steps.provision.outcome == 'success' && matrix.frontend == true }}
        timeout-minutes: 5
        shell: bash
        run: cargo xtask build frontend-build

      - id: frontend-check
        name: Type-check frontend
        if: ${{ !cancelled() && steps.provision.outcome == 'success' && matrix.frontend == true }}
        timeout-minutes: 5
        shell: bash
        run: cargo xtask run frontend-check

      # Clippy ==========================================================================================================
      # Platform-gated by the targets' `platforms:` lists. `clippy-hole` covers the
      # Hole platforms with `--workspace`; `clippy-ex-galoshes` covers the
      # platforms Hole doesn't ship on with the ex-Galoshes `-p` filter set.
      - id: clippy-hole
        name: Clippy (Hole workspace)
        if: ${{ !cancelled() && steps.provision.outcome == 'success' && matrix.hole == true }}
        timeout-minutes: 40
        shell: bash
        run: cargo xtask run clippy-hole

      - id: clippy-ex-galoshes
        name: Clippy (ex-Galoshes only)
        if: ${{ !cancelled() && steps.provision.outcome == 'success' && matrix.hole != true }}
        timeout-minutes: 40
        shell: bash
        run: cargo xtask run clippy-ex-galoshes

      # rustdoc, warnings denied: a broken intra-doc link fails the leg; per leg
      # because a link to a `cfg`-gated item resolves on some targets and not
      # others. Budget assumes the bins command reuses nothing from the libs one:
      # 1.25 x (7m15s + 6m22s + 50s) rounds up to 20m.
      - id: doc-hole
        name: Rustdoc (Hole workspace)
        if: ${{ !cancelled() && steps.provision.outcome == 'success' && matrix.hole == true }}
        timeout-minutes: 20
        shell: bash
        run: cargo xtask run doc-hole

      - id: doc-ex-galoshes
        name: Rustdoc (ex-Galoshes only)
        if: ${{ !cancelled() && steps.provision.outcome == 'success' && matrix.hole != true }}
        timeout-minutes: 10
        shell: bash
        run: cargo xtask run doc-ex-galoshes

      # Archive lanes ===================================================================================================
      # The ex-Galoshes crates plus the workspace tooling crates (stepstool,
      # dev-console, xtask, xtask-lib, payload-archive; #454), archived once and
      # run by the three steps below. These run first, before anything writes
      # outside gitignored paths, so tooling's git/prek tests see a clean tree.
      # The mock-plugin fixture bin is ungated and always archived
      # (crates/garter/tests/common/mod.rs).
      # `df` records disk use per phase: one VM holds the debug workspace,
      # this archive and the release builds.
      - id: archive
        name: Build test archive (ex-Galoshes + tooling crates)
        if: ${{ !cancelled() && steps.provision.outcome == 'success' }}
        timeout-minutes: 15
        shell: bash
        run: |
          mkdir -p ci-artifacts
          cargo nextest archive -p garter -p garter-bin -p galoshes -p stepstool -p dev-console -p xtask -p xtask-lib -p payload-archive -p util --archive-file ci-artifacts/tests.tar.zst
          df -h .

      # `cargo nextest run --archive-file` refuses `-p`; the archive's package
      # set is frozen at build time. Filter by `-E package(...)` instead.
      # `target/debug/` must exist because skuld writes its test-coordination
      # SQLite DB at `<workspace>/target/debug/.skuld.db`.
      - id: test-garter
        name: Test garter
        if: ${{ !cancelled() && steps.archive.outcome == 'success' }}
        timeout-minutes: 10
        shell: bash
        run: |
          mkdir -p target/debug
          cargo-nextest nextest run \
            --archive-file ci-artifacts/tests.tar.zst \
            --workspace-remap "${{ github.workspace }}" \
            -E 'package(garter) + package(garter-bin)'

      - id: test-galoshes
        name: Test galoshes
        if: ${{ !cancelled() && steps.archive.outcome == 'success' }}
        timeout-minutes: 10
        shell: bash
        run: |
          mkdir -p target/debug
          cargo-nextest nextest run \
            --archive-file ci-artifacts/tests.tar.zst \
            --workspace-remap "${{ github.workspace }}" \
            -E 'package(galoshes)'

      # `!windows_console` excludes dev-console's labeled console-corruption
      # test: it panics loudly on a non-interactive console, so it only runs
      # manually from an interactive Windows terminal:
      #   SKULD_LABELS=windows_console cargo nextest run -p dev-console \
      #     -E 'test(null_stdin_child_cannot_corrupt_console_mode)'
      #
      # Budget 20: windows/arm64 ran 8m52s green, then 10m18s on an unchanged
      # test set, under a budget of 10.
      - id: test-tooling
        name: Test tooling
        if: ${{ !cancelled() && steps.archive.outcome == 'success' }}
        timeout-minutes: 20
        shell: bash
        env:
          SKULD_LABELS: "!windows_console"
        run: |
          mkdir -p target/debug
          cargo nextest run \
            --archive-file ci-artifacts/tests.tar.zst \
            --workspace-remap "${{ github.workspace }}" \
            -E 'package(stepstool) + package(dev-console) + package(xtask) + package(xtask-lib) + package(payload-archive) + package(util)'

      # Loopback users that precede the Hole build ======================================================================

      # Plugin interop/e2e (crate `plugin-e2e`, #435): ex-ray<->stock interop on
      # all 6 platforms (QUIC not(windows)) + galoshes server<->client
      # roundtrips (WS all platforms; WS-TLS/QUIC not(windows)). A fresh build,
      # not the archive lane: these spawn plugin BINARIES and need on-disk
      # artifacts (ex-ray + galoshes from `setup-build`'s `cargo xtask deps`, and
      # the pinned stock v2ray-plugin the `plugin-e2e-tests` target provisions).
      # It re-runs the sidecar cascade, so it precedes `hole-build`.
      - id: test-plugin-e2e
        name: Test plugin-e2e
        if: ${{ !cancelled() && steps.provision.outcome == 'success' }}
        timeout-minutes: 45
        shell: bash
        run: cargo xtask run plugin-e2e-tests

      # ex-ray Go tests (the `ex-ray-tests` build.yaml target): the ECH
      # fail-closed gate plus the patched vendored tls/quic/hysteria2 (incl. utls)
      # gate/refuse/round-trip tests. The gate logic is platform-independent
      # (domainsocket is !windows), so one Linux leg runs it.
      - id: test-ex-ray-ech
        name: Test ex-ray Go (ECH gate)
        if: ${{ !cancelled() && steps.provision.outcome == 'success' && matrix.ech == true }}
        timeout-minutes: 20
        shell: bash
        run: cargo xtask run ex-ray-tests

      # ex-ray's own Go tests on the platforms with build-tagged files
      # (keepalive_{windows,darwin}.go), which a Linux lane never compiles. See
      # the `ex-ray-unit-tests` target for why it is split from the ECH tests.
      - id: test-ex-ray-unit
        name: Test ex-ray Go (platform files)
        if: ${{ !cancelled() && steps.provision.outcome == 'success' && matrix.ex-ray-unit == true }}
        timeout-minutes: 20
        shell: bash
        run: cargo xtask run ex-ray-unit-tests

      # Installer assembly ==============================================================================================
      # Release builds; they re-run the sidecar cascade, so they precede
      # `hole-build`. Budget 80 for both assembly steps, held equal by
      # `ci_installer_assembly_steps_share_a_timeout_budget`; sized for a cold
      # sccache (GitHub evicts entries untouched for 7 days); the maxima are in
      # STEP-LEVEL BUDGETS below.

      # `scripts/*` of the MSI project: unit tests of the assembly, no build.
      - id: installer-pytest
        name: Test MSI assembly scripts
        if: ${{ !cancelled() && steps.provision.outcome == 'success' && matrix.installer == true }}
        timeout-minutes: 5
        shell: pwsh
        working-directory: msi-installer
        run: |
          # A stale lockfile fails the same way on every attempt: check it offline before the retry.
          uv lock --check --offline
          if ($LASTEXITCODE -ne 0) { throw "uv lock --check exited with $LASTEXITCODE" }
          # Fetch the test dependencies under retry; retrying the run would retry a test failure.
          & ../.github/scripts/retry.ps1 -What 'uv sync (msi-installer)' -Script {
            uv sync --group dev
            if ($LASTEXITCODE -ne 0) { throw "uv sync exited with $LASTEXITCODE" }
          }
          uv run --group dev pytest -v

      - id: installer-build-msi
        name: Build MSI
        if: ${{ !cancelled() && steps.provision.outcome == 'success' && matrix.installer == true }}
        timeout-minutes: 80
        shell: pwsh
        run: cargo xtask build hole-msi

      - id: installer-smoke
        name: Smoke-test binary
        if: ${{ !cancelled() && steps.installer-build-msi.outcome == 'success' }}
        timeout-minutes: 5
        shell: pwsh
        run: target\release\hole.exe version

      # tauri-driver is installed via `cargo install`; the cargo registry cache
      # and sccache from setup-build keep this fast. `--locked` and a pinned
      # version guard against flakes from unrelated bumps in the crate. It, the
      # driver and gsudo are tool installs that need nothing from the MSI, so
      # they sit before `hole-build` with the rest of the toolchain users.
      - id: installer-tauri-driver
        name: Install tauri-driver
        if: ${{ !cancelled() && steps.provision.outcome == 'success' && matrix.installer == true }}
        timeout-minutes: 5
        shell: bash
        run: .github/scripts/retry.sh cargo install --locked --version 2.0.6 tauri-driver

      # tauri-driver speaks to WebView2 via Microsoft Edge's WebDriver. The
      # runner's bundled msedgedriver (`$EDGEWEBDRIVER`) targets the Edge BROWSER
      # version on the image, but the WebView2 RUNTIME (which hole.exe actually
      # loads) auto-updates independently and is typically a higher version;
      # msedgedriver then rejects the session with "only supports Microsoft Edge
      # version N". Detect the installed runtime version and download the
      # matching msedgedriver from Microsoft's CDN. See bindreams/hole#372.
      - id: installer-msedgedriver
        name: Install msedgedriver matching WebView2 runtime
        if: ${{ !cancelled() && steps.provision.outcome == 'success' && matrix.installer == true }}
        timeout-minutes: 5
        shell: pwsh
        run: |
          $key = "HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}"
          $webview2 = (Get-ItemProperty -Path $key -Name pv).pv
          Write-Host "WebView2 runtime version: $webview2"
          $url = "https://msedgedriver.microsoft.com/$webview2/edgedriver_win64.zip"
          $zip = "$env:RUNNER_TEMP\edgedriver.zip"
          $out = "$env:RUNNER_TEMP\edgedriver"
          & .github/scripts/retry.ps1 -What 'download msedgedriver' -Script { Invoke-WebRequest -Uri $url -OutFile $zip }
          Expand-Archive -Path $zip -DestinationPath $out -Force
          Add-Content -Path $env:GITHUB_PATH -Value $out

      # gsudo runs the dashboard E2E at Medium integrity. GitHub runners run
      # every process at High integrity (admin + UAC disabled), and WebView2
      # Runtime 150 broke the DevTools loopback for High-integrity hosts
      # (MicrosoftEdge/WebView2Feedback#5640) so tauri-driver can't attach.
      # Real users run the GUI unprivileged (Medium), where 150 works.
      - id: installer-gsudo
        name: Install gsudo (de-elevation for the E2E)
        if: ${{ !cancelled() && steps.provision.outcome == 'success' && matrix.installer == true }}
        timeout-minutes: 5
        shell: pwsh
        env:
          # renovate: datasource=github-releases depName=gerardog/gsudo
          GSUDO_VERSION: "2.6.1"
        run: |
          $zip = "$env:RUNNER_TEMP\gsudo.zip"
          $dir = "$env:RUNNER_TEMP\gsudo"
          $url = "https://github.com/gerardog/gsudo/releases/download/v$env:GSUDO_VERSION/gsudo.portable.zip"
          & .github/scripts/retry.ps1 -What 'download gsudo' -Script { Invoke-WebRequest -Uri $url -OutFile $zip }
          Expand-Archive -Path $zip -DestinationPath $dir -Force
          $exe = "$dir\x64\gsudo.exe"
          if (-not (Test-Path $exe)) { throw "gsudo.exe not found at $exe after extract" }
          "$dir\x64" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      # DMG assembly + signature-consistency tests (`dmg-installer/`): catches an
      # unsigned .app bundle that launches "damaged" under Gatekeeper quarantine
      # (#364). One build+test via the run-cascade (builds hole-dmg once, then the
      # signing pytest); a separate `build hole-dmg` step would double-roll the
      # flaky bundle_dmg.sh/hdiutil pipeline (#446).
      #
      # Local time, the zone `log show --start` reads, so the diagnostics below
      # span this step whatever its budget is.
      - id: dmg-start
        name: Record DMG start
        if: ${{ !cancelled() && steps.provision.outcome == 'success' && matrix.dmg == true }}
        timeout-minutes: 5
        shell: bash
        run: |
          echo "DMG_START=$(date +'%Y-%m-%d %H:%M:%S')" >> "$GITHUB_ENV"
          # The DMG tests require a clean tracked tree; name any earlier step that dirtied it.
          git status --porcelain --untracked-files=no

      - id: dmg
        name: Build DMG and test signing
        if: ${{ !cancelled() && steps.dmg-start.outcome == 'success' }}
        timeout-minutes: 80
        shell: bash
        run: |
          cargo xtask run hole-dmg-tests
          df -h .

      # hdiutil DMG creation/mounting is a non-deterministic macOS
      # DiskArbitration race; capture system state when the DMG step fails (build
      # or the pytest mount) to diagnose the next occurrence (#446). A step
      # timeout is a failure of the step, so this fires on it too.
      - id: dmg-diagnostics
        name: Capture DiskArbitration/hdiutil state on failure
        if: ${{ !cancelled() && steps.dmg.outcome == 'failure' }}
        timeout-minutes: 5
        shell: bash
        run: |
          set +e
          OUT="$RUNNER_TEMP/dmg-flake-diag"
          mkdir -p "$OUT"
          hdiutil info    > "$OUT/hdiutil-info.txt" 2>&1
          ls -la /Volumes > "$OUT/volumes.txt"      2>&1
          mount           > "$OUT/mount.txt"        2>&1
          log show --start "$DMG_START" --predicate \
            'process == "diskarbitrationd" OR process == "diskimagesiod" OR process == "mds" OR process == "mds_stores"' \
            > "$OUT/diskarb-log.txt" 2>&1
          echo "captured DMG-flake diagnostics to $OUT"

      - id: dmg-upload-diagnostics
        name: Upload DMG flake diagnostics
        if: ${{ !cancelled() && steps.dmg.outcome == 'failure' }}
        timeout-minutes: 5
        uses: ./.github/actions/upload-diagnostics
        with:
          name: dmg-flake-diag-${{ matrix.os }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/dmg-flake-diag/**
          if-no-files-found: ignore
          retention-days: 14

      # Hole test lanes =================================================================================================
      # Compile test binaries via the orchestrator (resolves the full DAG:
      # ex-ray -> galoshes -> wintun -> hole -> hole-tests) but don't run them
      # yet. Nothing after this step rewrites the sidecars or builds in the debug
      # profile, so the lanes below re-execute these binaries (see #200 for the
      # NDIS-loopback corruption that motivates running TUN tests last).
      #
      # Budget 70 (STEP-LEVEL BUDGETS below).
      - id: hole-build
        name: Build hole test binaries
        if: ${{ !cancelled() && steps.provision.outcome == 'success' && matrix.hole == true }}
        timeout-minutes: 70
        shell: bash
        run: |
          cargo xtask build hole-tests
          df -h .

      # The build state every later step is held to. `hole-verify-no-compile`
      # (after the last lane) compares it with the state then.
      - id: hole-build-state
        name: Record the build state after hole-build
        if: ${{ !cancelled() && steps.hole-build.outcome == 'success' }}
        timeout-minutes: 5
        shell: bash
        run: .github/scripts/target-state.sh snapshot target/build-state-after-hole-build.json

      # A SKULD_LABELS value that stops matching anything leaves its step a
      # silent no-op: the complementary one absorbs the whole suite and both
      # stay green. This asserts, before either runs, that the "!tun"/"tun"
      # pair below parses as exact complements and that each side still
      # selects at least one compiled-in test. Per-package contribution is
      # NOT checked — see `xtask::skuld_label_coverage` for why it can't be.
      - id: hole-verify-partition
        name: Verify SKULD_LABELS TUN/non-TUN partition
        if: ${{ !cancelled() && steps.hole-build.outcome == 'success' }}
        timeout-minutes: 15
        shell: bash
        env:
          CARGO_LOG: cargo::core::compiler::fingerprint=info
        run: .github/scripts/fail-on-compile.sh cargo run --package xtask -- verify-skuld-label-coverage

      # A rename applied to only one of the two places that must agree — the
      # `.config/nextest.toml` name-substring filter and the skuld label
      # attached at a test's definition site — silently drops it from the
      # `global_net_state` cross-binary serialization group. That reads as an
      # intermittent flake, not the rename that caused it — see
      # bindreams/hole#894.
      #
      # `--record` writes the membership just verified for the proof step (below)
      # to read back after the lanes — see `verify` in
      # global_net_state_conformance.rs for why it isn't re-listed there
      # instead. bindreams/hole#999.
      - id: hole-verify-labels
        name: Verify global_net_state label matches the nextest.toml filter
        if: ${{ !cancelled() && steps.hole-build.outcome == 'success' }}
        timeout-minutes: 10
        shell: bash
        env:
          CARGO_LOG: cargo::core::compiler::fingerprint=info
        run: >
          .github/scripts/fail-on-compile.sh
          cargo run --package xtask -- verify-global-net-state-labels --record target/global-net-state-expected.json

      # The startup strip (`child_env::strip_run_injected`) removes what `cargo
      # run` injects by a prefix rule, so a variable cargo adds later would slip
      # through it and make `ring`'s build script rerun. `verify-run-injected-env`
      # runs under a real `cargo run` and fails on any variable it was launched
      # with that is neither this step's own, nor stripped, nor on its list of
      # kept toolchain names. The environment cargo's parent had is recorded here,
      # before cargo is involved, by an external `env -0`: it lists what a child
      # sees, including names that are not shell identifiers (`ProgramFiles(x86)`)
      # which a shell builtin leaves out, and its NUL separators keep values with
      # newlines from corrupting the file. `env` has its own `_`, which bash puts
      # in the environment of every external command it runs.
      - id: hole-verify-run-env
        name: Verify the startup strip covers what cargo run injects
        if: ${{ !cancelled() && steps.hole-build.outcome == 'success' }}
        timeout-minutes: 5
        shell: bash
        env:
          CARGO_LOG: cargo::core::compiler::fingerprint=info
        run: |
          mkdir -p target
          env -0 > target/run-parent-env.bin
          .github/scripts/fail-on-compile.sh cargo run --package xtask -- verify-run-injected-env --parent-env-names target/run-parent-env.bin

      # `--no-default-features` mirrors the `hole-tests` xtask target. Without
      # it Cargo recompiles `hole` with `tauri/custom-protocol` ON (different
      # feature set -> different fingerprint -> fresh build), whose build.rs
      # generates the Tauri context in production mode and fails on
      # missing `ui/dist/`. See bindreams/hole#372. The
      # `--features tombstone/crash-dumps,tombstone/crash-child` + `package(tombstone)`
      # also mirror `hole-tests` so the crash-marker tests `build hole-tests`
      # compiled actually run (matching feature set -> no rebuild). See #522.
      # The `ci_test_hole_steps_match_the_hole_tests_target` conformance test
      # holds every nextest step of the `hole-` lanes equal to that target's `run:`.
      #
      # STEP-LEVEL BUDGETS (#989). A step that blows its own budget fails
      # normally: the job runs on and the later lanes still report; when the
      # job WALL fires instead, the lanes after the hung step do not run.
      # Sized off per-step maxima over 200 runs (2026-09-23 -> 2026-10-17):
      #
      #   non-TUN   windows 23.2m   darwin/amd64 32.3m   darwin/arm64 13.7m  -> 45
      #   TUN       windows  6.4m   darwin/amd64 21.2m   darwin/arm64  8.1m  -> 30
      #   hole-build   darwin/amd64 52.4m (median 27.8m, p90 38.4m)               -> 70
      #   installers   MSI 18.8m (windows)   DMG 50.8m (darwin/amd64, a failed
      #                run; 46.4m the slowest green)                              -> 80
      #
      # Slow runs are part of that spread, not outliers: darwin/amd64's 32.3m and
      # 21.2m are one run. Raised only, never tightened.
      #
      # NO COMPILING. Nothing after `hole-build` may compile or run a build script:
      # the steps only re-execute what it compiled, and one that compiles has a
      # different fingerprint from the build (a leaked environment variable, a
      # build script that reruns on every invocation) while still passing.
      # `hole-verify-no-compile`, after the last lane, compares the build state
      # (`.github/scripts/target-state.py`: the files cargo rewrites on any
      # compile) with the one `hole-build-state` recorded, so it catches a
      # compile however cargo was launched and whether or not it printed.
      # `fail-on-compile.sh` around a step compares the same state per step and
      # names the units from cargo's `Compiling` lines; `CARGO_LOG` makes cargo
      # log why each was dirty. A gated xtask step runs `cargo run --package
      # xtask --`, since the `cargo xtask` alias's `--quiet` hides those lines.
      - id: hole-test-non-tun
        name: Test (non-TUN)
        if: ${{ !cancelled() && steps.hole-build.outcome == 'success' }}
        timeout-minutes: 45
        shell: bash
        env:
          CARGO_LOG: cargo::core::compiler::fingerprint=info
          SKULD_LABELS: "!tun"
          # Selects `.config/nextest.toml`'s `[profile.non-tun]`, an empty
          # table that inherits `[profile.default.junit].path` and every
          # `[[profile.default.overrides]]` entry — including the
          # `global_net_state` test-group. Each profile writes its own JUnit
          # report (`target/nextest/non-tun/junit.xml`), so this lane's
          # report survives the TUN lane's run below rather than being
          # overwritten by it; see that file's comment. Set via env rather
          # than a `--profile` flag because
          # `ci_test_hole_steps_match_the_hole_tests_target` holds every
          # `hole-` nextest step's command text equal to build.yaml's
          # `hole-tests` target — `NEXTEST_PROFILE` is exempted from that
          # comparison (`ci_nextest_parity::FINGERPRINT_NEUTRAL_ENV`) because
          # nextest reads it at its own run/list time, never cargo's.
          NEXTEST_PROFILE: non-tun
        run: >
          .github/scripts/fail-on-compile.sh
          cargo nextest run --no-default-features
          --features tombstone/crash-dumps,tombstone/crash-child --no-fail-fast
          -E 'package(hole) + package(hole-bridge) + package(hole-common)
              + package(tun-engine) + package(tun-engine-macros)
              + package(dump) + package(dump-macros)
              + package(handle-holders) + package(tombstone)
              + package(hole-test-observability)'

      # Installer install + E2E (Windows) ===============================================================================
      # The E2E drives the INSTALLED binary through WebDriver over loopback, so
      # it runs before the TUN lane. The block is self-cleaning (Uninstall and
      # Verify uninstall run `always()`), and the TUN lane runs only once nothing
      # is left installed: Verify uninstall passed, or the MSI was never
      # installed. Otherwise the MSI's SYSTEM `HoleBridge` service would share
      # WFP, routes and the adapter with the TUN tests and confound their
      # verdicts.

      - id: installer-install
        name: Install
        if: ${{ !cancelled() && steps.installer-build-msi.outcome == 'success' }}
        timeout-minutes: 15
        shell: pwsh
        run: |
          & .github/scripts/invoke-msiexec-bounded.ps1 -Verb /i -MsiPath target\release\hole.msi -LogPath "$env:RUNNER_TEMP\msi-install.log" -FailOnNonZeroExit

      - id: installer-verify-install
        name: Verify install
        if: ${{ !cancelled() && steps.installer-install.outcome == 'success' }}
        timeout-minutes: 5
        shell: pwsh
        run: |
          $binDir = "C:\Program Files\hole\bin"
          foreach ($f in @("hole.exe", "ex-ray.exe", "galoshes.exe", "wintun.dll")) {
            if (!(Test-Path "$binDir\$f")) { throw "$f not found" }
          }
          $svc = Get-Service -Name HoleBridge -ErrorAction SilentlyContinue
          if (!$svc) { throw "HoleBridge service not registered" }
          $path = [Environment]::GetEnvironmentVariable("Path", "Machine")
          if ($path -notmatch [regex]::Escape($binDir)) { throw "$binDir not in PATH" }

      # The MSI's `LaunchApp` custom action runs `hole.exe --show-dashboard`
      # after a fresh install. Tauri's single-instance plugin would route
      # tauri-driver's new launch into that already-running instance, so we
      # need a clean slate. The shared script resolves the processes before
      # killing them and waits on those objects, so an SCM-restarted bridge
      # cannot be mistaken for one that never died.
      - id: installer-kill-launch
        name: Kill any running hole.exe (post-install LaunchApp)
        if: ${{ !cancelled() && steps.installer-install.outcome == 'success' }}
        timeout-minutes: 5
        shell: pwsh
        run: |
          & .github/scripts/kill-hole-processes.ps1

      # Prove on the real runner that de-elevation preserves everything the E2E
      # needs — integrity (Medium), env vars, PATH (npm), streamed stdout, and
      # the exact exit code — via the SAME gsudo -> powershell -File launcher
      # the E2E uses. Fails loud here rather than as an opaque session timeout.
      - id: installer-verify-gsudo
        name: Verify gsudo de-elevation contract
        if: ${{ !cancelled() && steps.installer-install.outcome == 'success' && steps.installer-gsudo.outcome == 'success' }}
        timeout-minutes: 5
        shell: pwsh
        run: |
          $env:HOLE_SELFTEST_CANARY = "canary-ok"
          # The child streams its IL=.../PROBE_OK line straight to the log and
          # exits 7 only when every contract check passes -- a nonzero sentinel
          # that also proves the exit code survives the launcher. Gate on that
          # and set the step's exit code explicitly (a lingering $LASTEXITCODE=7
          # would otherwise fail the step under GitHub's pwsh wrapper).
          pwsh -NoProfile -File .github/scripts/run-at-medium.ps1 -Script .github/scripts/verify-gsudo-deelevation.ps1
          $code = $LASTEXITCODE
          if ($code -ne 7) { Write-Host "::error::gsudo de-elevation contract failed (exit $code); see child output above"; exit 1 }
          Write-Host "OK: de-elevation verified (Medium + env + PATH + stdout + exit code)"
          exit 0

      # WebDriverIO smoke test against the INSTALLED binary, gating
      # bindreams/hole#372 (dashboard loads bundled frontend, not the WebView2
      # "localhost refused" error page). Runs at Medium integrity through the
      # shared launcher. The installed-binary guard lives in e2e-medium.ps1
      # (inside the child), so it runs where wdio actually reads
      # HOLE_TEST_APP_PATH. `node_modules/` is reused from the `frontend-build`
      # that produced the MSI.
      - id: installer-e2e
        name: E2E dashboard test (Medium integrity)
        if: ${{ !cancelled() && steps.installer-verify-gsudo.outcome == 'success' && steps.installer-tauri-driver.outcome == 'success' && steps.installer-msedgedriver.outcome == 'success' }}
        timeout-minutes: 5
        shell: pwsh
        env:
          HOLE_TEST_APP_PATH: 'C:\Program Files\hole\bin\hole.exe'
        run: |
          pwsh -NoProfile -File .github/scripts/run-at-medium.ps1 -Script .github/scripts/e2e-medium.ps1
          exit $LASTEXITCODE

      # Same TerminateProcess-returns-before-reap gap as the earlier "Kill any
      # running hole.exe" step above, and the same script: without the wait,
      # the Uninstall step's msiexec can start while hole.exe still holds
      # file/service handles it needs to release.
      - id: installer-kill
        name: Kill hole.exe after E2E
        if: ${{ always() && matrix.installer == true && steps.installer-install.outcome != 'skipped' }}
        timeout-minutes: 5
        shell: pwsh
        run: |
          & .github/scripts/kill-hole-processes.ps1

      - id: installer-dump-log
        name: Dump install log on failure
        if: ${{ failure() && matrix.installer == true }}
        timeout-minutes: 5
        shell: pwsh
        run: |
          $log = "$env:RUNNER_TEMP\msi-install.log"
          if (Test-Path $log) { Get-Content $log -Tail 200 }

      - id: installer-uninstall
        name: Uninstall
        if: ${{ always() && matrix.installer == true && steps.installer-install.outcome != 'skipped' }}
        timeout-minutes: 15
        shell: pwsh
        run: |
          & .github/scripts/invoke-msiexec-bounded.ps1 -Verb /x -MsiPath target\release\hole.msi -LogPath "$env:RUNNER_TEMP\msi-uninstall.log"

      - id: installer-verify-uninstall
        name: Verify uninstall
        if: ${{ always() && matrix.installer == true && steps.installer-install.outcome != 'skipped' }}
        timeout-minutes: 5
        shell: pwsh
        run: |
          $binDir = "C:\Program Files\hole\bin"
          if (Test-Path $binDir) { throw "$binDir still exists" }
          $svc = Get-Service -Name HoleBridge -ErrorAction SilentlyContinue
          if ($svc) { throw "HoleBridge service still registered" }
          $path = [Environment]::GetEnvironmentVariable("Path", "Machine")
          if ($path -match [regex]::Escape($binDir)) { throw "$binDir still in PATH" }

      # Evidence outlives the runner. The bounded wait in
      # invoke-msiexec-bounded.ps1 is what lets a wedged msiexec fail its step
      # instead of the whole job, so this step is reached to upload it.
      # `/l*vx` writes both logs regardless of exit code once Install/
      # Uninstall start msiexec, so `if-no-files-found: ignore` only covers a
      # job that failed before either did. `*-stack-*.txt` are the per-thread
      # native stacks a wedge captures; they are echoed into the job log too,
      # and exist only when a step wedged; `*-cdbout-*.log` is the debugger's
      # stdout, the backstop for a capture whose log file never opened.
      - id: installer-upload-msi-logs
        name: Upload MSI logs
        if: ${{ always() && matrix.installer == true }}
        timeout-minutes: 5
        uses: ./.github/actions/upload-diagnostics
        with:
          name: msi-logs-windows-amd64
          path: |
            ${{ runner.temp }}/msi-install.log
            ${{ runner.temp }}/msi-uninstall.log
            ${{ runner.temp }}/*-stack-*.txt
            ${{ runner.temp }}/*-cdbout-*.log
          if-no-files-found: ignore
          retention-days: 14

      # bridge.log (C:\ProgramData\hole\logs) has the only record of what the
      # HoleBridge SERVICE process itself was doing -- SCM start/stop/restart,
      # the liveness lock, IPC bind -- none of which appears in the MSI logs. On
      # failure only: this repo has an unresolved uninstall-hang history (#790)
      # this is meant to help close. Named apart from the test lane's
      # `bridge-logs-windows-amd64`: both run in one job and an artifact name
      # is unique per run.
      - id: installer-upload-bridge-logs
        name: Upload installed-bridge logs on failure
        if: ${{ failure() && matrix.installer == true }}
        timeout-minutes: 5
        uses: ./.github/actions/upload-diagnostics
        with:
          name: bridge-logs-installer-windows-amd64
          path: C:\ProgramData\hole\logs\**
          if-no-files-found: ignore
          retention-days: 14

      # TUN lanes =======================================================================================================
      # Quoted: an unquoted ` #` opens a YAML comment and truncates the name.
      - id: hole-test-tun
        name: "Test (TUN, last test lane for #200)"
        if: ${{ !cancelled() && steps.hole-build.outcome == 'success' && matrix.os == 'windows' && matrix.arch == 'amd64' && (steps.installer-install.outcome == 'skipped' || steps.installer-verify-uninstall.outcome == 'success') }}
        timeout-minutes: 25
        shell: bash
        env:
          CARGO_LOG: cargo::core::compiler::fingerprint=info
          SKULD_LABELS: "tun"
          # `.config/nextest.toml`'s `[profile.tun]` — see the non-TUN step's
          # comment above; same inheritance, own JUnit report
          # (`target/nextest/tun/junit.xml`).
          NEXTEST_PROFILE: tun
        # `--no-fail-fast`: this lane serializes many independent real-OS-effect
        # tests behind one elevated token; one failure otherwise cancels the
        # rest of the run, hiding every verdict downstream of the first
        # failure for a whole CI round (bindreams/hole#961 — 14 of 29 TUN
        # tests cancelled by one failure, hiding five others for two rounds).
        # Only changes how many tests run after a failure, never whether a
        # passing run fails.
        run: >
          .github/scripts/fail-on-compile.sh
          cargo nextest run --no-default-features
          --features tombstone/crash-dumps,tombstone/crash-child --no-fail-fast
          -E 'package(hole) + package(hole-bridge) + package(hole-common)
              + package(tun-engine) + package(tun-engine-macros)
              + package(dump) + package(dump-macros)
              + package(handle-holders) + package(tombstone)
              + package(hole-test-observability)'

      # The `global_net_state` check above only proves the group's tests were
      # SELECTABLE; a job that silently ran zero of them (e.g. nextest's own
      # group/filter machinery mis-scheduling on Windows) would still read as
      # green. This diffs the membership that check recorded against the two
      # lanes' own-profile JUnit reports and fails on any member that never shows
      # up as executed — bindreams/hole#999.
      #
      # WINDOWS LEG ONLY, and the name says so: the darwin legs would need their
      # own pair of `non-tun`/`tun` profiles too, but their walls are the scarce
      # resource this repo protects, so extending the proof there is a
      # separately-measured decision.
      #
      # Gated on both lanes passing rather than on `success()`: the proof answers
      # "did everything run", which is only interesting once "did everything
      # pass" is yes, and a failed lane is its own, louder signal that leaves
      # partial reports. Naming the two outcomes (not the whole job) keeps an
      # unrelated lane's failure from hiding it. This is the one toolchain user
      # after the TUN lane (#200): a set diff over two files and a recorded
      # listing, no network, no test execution, no timing.
      - id: hole-verify-executed
        name: "Verify every global_net_state test executed (windows leg, #999)"
        if: ${{ !cancelled() && steps.hole-test-non-tun.outcome == 'success' && steps.hole-test-tun.outcome == 'success' }}
        timeout-minutes: 5
        shell: bash
        env:
          CARGO_LOG: cargo::core::compiler::fingerprint=info
        run: >
          .github/scripts/fail-on-compile.sh
          cargo run --package xtask -- verify-global-net-state-executed
          --expected target/global-net-state-expected.json
          --junit target/nextest/non-tun/junit.xml
          --junit target/nextest/tun/junit.xml

      # macOS TUN lane runs UNDER ROOT: the lockdown real-engage test (#527)
      # drives `pfctl -E`/`-f`, which require root. The runner's cargo/nextest
      # and the user-owned `target/` are reused via `sudo env PATH/HOME` (the
      # binaries are prebuilt above; nextest only re-executes them). macOS
      # runners have passwordless sudo. Windows engages WFP from the elevated
      # token; macOS has no such token, so root is the equivalent.
      #
      # `--features` must match `hole-build` and the non-TUN step above or cargo
      # rebuilds instead of reusing the prebuilt binaries, and so must every
      # variable cargo hashes. `sudo env` replaces the whole environment, so each
      # such variable is forwarded
      # (`a_privileged_lane_forwards_the_variables_that_feed_cargos_fingerprint`)
      # as `${VAR+"VAR=$VAR"}`, which keeps an unset one unset rather than empty.
      # NEXTEST_PROFILE=tun (see the windows TUN step's comment above): this
      # step runs under `sudo`, so without a lane-specific profile it would
      # write a ROOT-owned `target/nextest/default/junit.xml` that no
      # subsequent unprivileged `cargo nextest run` in this checkout could
      # overwrite or clean up (exit 110) even though the tests themselves had
      # already passed.
      - id: hole-test-tun-macos
        name: Test (TUN, macOS — root for pfctl)
        if: ${{ !cancelled() && steps.hole-build.outcome == 'success' && matrix.os == 'darwin' }}
        timeout-minutes: 30
        shell: bash
        env:
          CARGO_LOG: cargo::core::compiler::fingerprint=info
        run: >
          .github/scripts/fail-on-compile.sh
          sudo env "PATH=$PATH" "HOME=$HOME" "CARGO_LOG=$CARGO_LOG"
          ${CARGO_INCREMENTAL+"CARGO_INCREMENTAL=$CARGO_INCREMENTAL"}
          ${PKG_CONFIG_PATH+"PKG_CONFIG_PATH=$PKG_CONFIG_PATH"}
          SKULD_LABELS=tun NEXTEST_PROFILE=tun
          cargo nextest run --no-default-features
          --features tombstone/crash-dumps,tombstone/crash-child --no-fail-fast
          -E 'package(hole) + package(hole-bridge) + package(hole-common)
              + package(tun-engine) + package(tun-engine-macros)
              + package(dump) + package(dump-macros)
              + package(handle-holders) + package(tombstone)
              + package(hole-test-observability)'

      # The job-level half of NO COMPILING (see the comment above `hole-test-non-tun`).
      # Reads only, so it may follow the macOS root lane. It runs whenever
      # `hole-build` succeeded, so a failed lane does not hide a compile; a missing
      # baseline (its step failed) is an error, not a pass.
      - id: hole-verify-no-compile
        name: Verify nothing compiled after hole-build
        if: ${{ !cancelled() && steps.hole-build.outcome == 'success' }}
        timeout-minutes: 5
        shell: bash
        run: |
          status=0
          .github/scripts/target-state.sh compare target/build-state-after-hole-build.json || status=$?
          if [[ "$status" -ne 0 ]]; then
            echo "::error title=Compiled after hole-build::a step after hole-build compiled or ran a build script (units above), or the build state could not be read (exit ${status})"
            exit 1
          fi

      # Renovate config =================================================================================================
      # `.github/renovate.json` is only ever executed by Renovate's own bot, so a
      # typo in it (`matchDepNamez`, a number where a duration string belongs) is
      # silently ignored rather than reported anywhere this repo can see. This
      # catches that the config is schema-valid; it says nothing about whether a
      # given rule actually applies to a given dependency — see
      # xtask/src/schemars_pin.rs's module doc for why that's not verified here.
      #
      # Last, because it swaps Node: the validator is deliberately run on the
      # newest LTS (the bot that reads this config is always Renovate's latest
      # release), while every other step uses the Node 24 that `package.json`
      # pins.
      - id: setup-node-lts
        uses: actions/setup-node@v7
        if: ${{ !cancelled() && steps.provision.outcome == 'success' && matrix.portable-lint == true }}
        timeout-minutes: 5
        with:
          node-version: lts/*
          check-latest: true

      # Named explicitly, with --no-global: naming a config file makes the
      # validator treat it as *global* self-hosted config by default, which
      # accepts a different option set and would pass configs Renovate rejects
      # at runtime -- --no-global keeps it validating as a *repository* config
      # instead. Without a file argument at all, the validator silently skips
      # every default config filename that doesn't exist and exits 0 with only
      # a warning logged, so a renovate.json moved or deleted in a refactor
      # would pass this job having validated nothing. Unpinned on purpose.
      # `--strict` makes warnings fatal.
      - id: renovate-config
        name: Validate .github/renovate.json
        if: ${{ !cancelled() && steps.setup-node-lts.outcome == 'success' }}
        timeout-minutes: 10
        shell: bash
        run: |
          # Fetch the validator under retry; retrying the run would retry a config error.
          .github/scripts/retry.sh npx --yes --package renovate renovate-config-validator --version
          npx --yes --package renovate renovate-config-validator --strict --no-global .github/renovate.json

      # Logs ============================================================================================================
      # Upload bridge.log produced by `DistHarness` subprocesses. Matches files
      # the test harness redirected to `$RUNNER_TEMP` (see
      # `crates/bridge/src/test_support/dist_harness.rs::new_tempdir`).
      #
      # Unconditional on darwin: nextest suppresses captured output on success,
      # and a passing darwin run is currently the only way to see the macOS
      # IPv6-assignment path's tracing output, which nothing asserts on yet.
      - id: hole-upload-bridge-logs
        name: Upload bridge logs (darwin always; else on failure)
        if: ${{ matrix.hole == true && (matrix.os == 'darwin' || failure() || cancelled()) }}
        timeout-minutes: 5
        uses: ./.github/actions/upload-diagnostics
        with:
          name: bridge-logs-${{ matrix.os }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/**/bridge.log
          if-no-files-found: ignore
          retention-days: 14
