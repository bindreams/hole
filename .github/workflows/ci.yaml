name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - uses: astral-sh/setup-uv@v10.0.1

      - uses: ./.github/actions/setup-build

      - name: Install prek
        run: uv tool install prek

      # cargo-clippy is skipped here because it's run per-platform in the
      # build job (see ci.yaml below). cargo-fmt stays active — it is
      # platform-independent, one Windows invocation covers the workspace.
      # SKIP=cargo-clippy lives in the prek target's `run.environment:`.
      - name: Run linters
        run: cargo xtask run prek

      # `scripts/*.py` keep their tests inline, and the filenames are
      # hyphenated, so pytest's default `test_*.py` collection finds nothing —
      # which is why sign-release.py's stale asset-count check reached a release
      # unnoticed (#682). `python_files` collects every script rather than a
      # hand-listed set, so a new script's tests run without touching CI.
      - name: Test release scripts
        run: uv run --with pytest --with PyYAML --with pathspec pytest -o python_files="*.py" scripts/

  # Per-platform build job: compiles clippy + test binaries once and publishes
  # them as a platform-scoped artifact (`build-<os>-<arch>`). Test jobs below
  # download the archive and run filtered tests without invoking the Rust
  # toolchain. See .tmp/claude/plans/i-want-to-refactor-polymorphic-catmull.md
  # for the full design (esp. the matrix `needs:` trade-off: compile errors
  # in any crate fail `build[P]` and skip all `test-*[P]` cells).
  build:
    name: Build (${{ matrix.os }}/${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows, arch: amd64, runner: windows-latest }
          - { os: darwin,  arch: amd64, runner: macos-15-intel }
          - { os: darwin,  arch: arm64, runner: macos-latest }
          - { os: linux,   arch: amd64, runner: ubuntu-latest }
          - { os: linux,   arch: arm64, runner: ubuntu-24.04-arm }
          - { os: windows, arch: arm64, runner: windows-11-arm }
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-build

      - uses: cargo-bins/cargo-binstall@v1.21.1

      - name: Install nextest
        shell: bash
        env:
          # Authenticated GitHub API has a 5000 req/h limit; without this,
          # binstall can hit the 60 req/h unauthenticated limit and fall
          # back to `cargo install`, which fails because nextest's
          # `locked-tripwire` crate requires --locked.
          GITHUB_TOKEN: ${{ github.token }}
        run: cargo binstall --no-confirm --locked cargo-nextest

      # Clippy coverage is platform-gated by the targets' `platforms:` lists.
      # `clippy-hole` covers Hole platforms (windows/amd64, darwin/*) with
      # `--workspace`; `clippy-ex-galoshes` covers the platforms Hole doesn't
      # ship on (linux/*, windows/arm64) with the ex-Galoshes -p filter set.
      # The `if:` gates here just suppress the "doesn't apply to host" error
      # from xtask on the wrong-platform half of the matrix.
      - name: Clippy (Hole workspace)
        if: matrix.os == 'darwin' || (matrix.os == 'windows' && matrix.arch == 'amd64')
        run: cargo xtask run clippy-hole

      - name: Clippy (ex-Galoshes only)
        if: matrix.os == 'linux' || (matrix.os == 'windows' && matrix.arch == 'arm64')
        run: cargo xtask run clippy-ex-galoshes

      # Archive the ex-Galoshes crates plus the workspace tooling crates
      # (stepstool, dev-console, xtask, xtask-lib, payload-archive;
      # #454) — consumed by test-garter / test-galoshes / test-tooling on all
      # platforms. Hole crates' compileability is already covered by `Clippy
      # (Hole workspace)` above; test-hole runs in its own build+test job below.
      # `--features garter/test-utils` builds garter's feature-gated
      # test-utils targets (tap_integration) into the archive — do not
      # rely on a sibling's dev-dep edge to unify the feature in. The
      # mock-plugin fixture bin is ungated and always archived (see
      # crates/garter/tests/common/mod.rs).
      - name: Build test archive (ex-Galoshes + tooling crates)
        shell: bash
        run: |
          mkdir -p ci-artifacts
          cargo nextest archive -p garter -p garter-bin -p galoshes -p stepstool -p dev-console -p xtask -p xtask-lib -p payload-archive -p util --features garter/test-utils --archive-file ci-artifacts/tests.tar.zst

      # The artifact is consumed by test-garter, test-galoshes, and
      # test-tooling; test-hole does its own build.
      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: build-${{ matrix.os }}-${{ matrix.arch }}
          path: ci-artifacts/tests.tar.zst
          retention-days: 3
          if-no-files-found: error

  # Three per-project test jobs, all consuming the `build-<os>-<arch>` artifact
  # and running `cargo nextest run --archive-file`. They install the nextest
  # binary via taiki-e/install-action (no Rust toolchain needed) and skip the
  # `setup-build` composite action entirely.
  test-garter:
    name: Test garter (${{ matrix.os }}/${{ matrix.arch }})
    needs: build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows, arch: amd64, runner: windows-latest }
          - { os: darwin,  arch: amd64, runner: macos-15-intel }
          - { os: darwin,  arch: arm64, runner: macos-latest }
          - { os: linux,   arch: amd64, runner: ubuntu-latest }
          - { os: linux,   arch: arm64, runner: ubuntu-24.04-arm }
          - { os: windows, arch: arm64, runner: windows-11-arm }
    steps:
      - uses: actions/checkout@v7

      - name: Install nextest (pre-built binary)
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - uses: actions/download-artifact@v8
        with:
          name: build-${{ matrix.os }}-${{ matrix.arch }}
          path: ci-artifacts

      # `cargo nextest run --archive-file` refuses `-p`; the archive's
      # package set is frozen at build time. Filter by `-E package(...)`
      # instead. `target/debug/` must exist because skuld writes its
      # test-coordination SQLite DB at `<workspace>/target/debug/.skuld.db`.
      - name: Run tests
        shell: bash
        run: |
          mkdir -p target/debug
          cargo-nextest nextest run \
            --archive-file ci-artifacts/tests.tar.zst \
            --workspace-remap "${{ github.workspace }}" \
            -E 'package(garter) + package(garter-bin)'

  test-galoshes:
    name: Test galoshes (${{ matrix.os }}/${{ matrix.arch }})
    needs: build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows, arch: amd64, runner: windows-latest }
          - { os: darwin,  arch: amd64, runner: macos-15-intel }
          - { os: darwin,  arch: arm64, runner: macos-latest }
          - { os: linux,   arch: amd64, runner: ubuntu-latest }
          - { os: linux,   arch: arm64, runner: ubuntu-24.04-arm }
          - { os: windows, arch: arm64, runner: windows-11-arm }
    steps:
      - uses: actions/checkout@v7

      - name: Install nextest (pre-built binary)
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - uses: actions/download-artifact@v8
        with:
          name: build-${{ matrix.os }}-${{ matrix.arch }}
          path: ci-artifacts

      - name: Run tests
        shell: bash
        run: |
          mkdir -p target/debug
          cargo-nextest nextest run \
            --archive-file ci-artifacts/tests.tar.zst \
            --workspace-remap "${{ github.workspace }}" \
            -E 'package(galoshes)'

  test-tooling:
    name: Test tooling (${{ matrix.os }}/${{ matrix.arch }})
    needs: build
    runs-on: ${{ matrix.runner }}
    # windows/arm64 sets the requirement and had almost no margin at 10: it ran
    # 8m52s green, then 10m18s (killed) on an unchanged test set. The other legs
    # are nowhere near — linux ~1m, windows/amd64 ~5m30s. Pinning Go adds
    # a toolchain download on images that ship a different one, worth ~1min on
    # this runner and enough to matter at 10.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows, arch: amd64, runner: windows-latest }
          - { os: darwin,  arch: amd64, runner: macos-15-intel }
          - { os: darwin,  arch: arm64, runner: macos-latest }
          - { os: linux,   arch: amd64, runner: ubuntu-latest }
          - { os: linux,   arch: arm64, runner: ubuntu-24.04-arm }
          - { os: windows, arch: arm64, runner: windows-11-arm }
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - uses: astral-sh/setup-uv@v10.0.1

      # `pull_subrepo`/`conflict.rs`'s tests (part of `package(xtask)`, run
      # by this job) shell to `go mod edit -json` to exercise the
      # allowlisted go.mod-conflict auto-resolution path for real — this
      # job builds nothing itself (it runs the `build` job's prebuilt
      # artifact), so unlike jobs that use `./.github/actions/setup-build`,
      # `go` isn't otherwise provisioned here. Some runner images happen to
      # ship a usable `go` anyway.
      - uses: actions/setup-go@v7
        with:
          go-version-file: crates/ex-ray/go.mod

      # `check_vendoring_integrity_tests`'s `always_run_hazard_end_to_end_*`
      # tests (part of `package(xtask)`, run by this job) install a real
      # `prek` hook and drive `pull_subrepo`/`finish_vendor_bump` through
      # it for real — unlike every other tool this job provisions,
      # `prek` isn't otherwise on PATH here (only the `lint` job installs
      # it), and per this repo's policy these tests must not skip on a
      # missing dependency.
      - name: Install prek
        shell: bash
        run: uv tool install prek

      # macOS runners ship only Apple's frozen Bash 3.2.57 on
      # /usr/bin/bash, ahead of Homebrew's bash on PATH; git-subrepo's
      # `#!/usr/bin/env bash` shebang hard-requires Bash 4+ and refuses to run
      # under 3.2. `brew install bash` puts a 4+ build in /opt/homebrew/bin
      # (arm64) or /usr/local/bin (intel), both of which precede /usr/bin on
      # the runner's default PATH. Linux and Windows (Git for Windows) already
      # ship Bash 4+, so this is scoped to macOS only.
      - name: Install Bash 4+ (macOS only, for git-subrepo)
        if: runner.os == 'macOS'
        shell: bash
        run: brew install bash

      - name: Install git-subrepo 0.4.9
        shell: bash
        run: |
          git clone --branch 0.4.9 --depth 1 https://github.com/ingydotnet/git-subrepo "$RUNNER_TEMP/git-subrepo"
          echo "$RUNNER_TEMP/git-subrepo/lib" >> "$GITHUB_PATH"

      - name: Install nextest (pre-built binary)
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - uses: actions/download-artifact@v8
        with:
          name: build-${{ matrix.os }}-${{ matrix.arch }}
          path: ci-artifacts

      # `cargo nextest run --archive-file` refuses `-p`; the archive's
      # package set is frozen at build time. Filter by `-E package(...)`
      # instead. `target/debug/` must exist because skuld writes its
      # test-coordination SQLite DB at `<workspace>/target/debug/.skuld.db`.
      #
      # `!windows_console` excludes dev-console's labeled console-corruption
      # test: it panics loudly on a non-interactive console, so it only runs
      # manually from an interactive Windows terminal:
      #   SKULD_LABELS=windows_console cargo nextest run -p dev-console \
      #     -E 'test(null_stdin_child_cannot_corrupt_console_mode)'
      - name: Run tests
        shell: bash
        env:
          SKULD_LABELS: "!windows_console"
        run: |
          mkdir -p target/debug
          cargo nextest run \
            --archive-file ci-artifacts/tests.tar.zst \
            --workspace-remap "${{ github.workspace }}" \
            -E 'package(stepstool) + package(dev-console) + package(xtask) + package(xtask-lib) + package(payload-archive) + package(util)'

  # test-hole runs a fresh build + nextest run (no archive). Hole tests have
  # too many environmental couplings (trybuild --offline registry, dist_fixture
  # workspace state, ipc_tests) for the archive-then-test pattern to work
  # reliably without significant additional plumbing — see #266 for the
  # tracking work to move test-hole onto the archive once those are addressed.
  test-hole:
    name: Test hole (${{ matrix.os }}/${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    # Per-leg, because the legs differ by ~2x: one number would either
    # under-budget darwin/amd64 or push every leg's hang-detection deadline out
    # to suit the slowest. Whole-job wall clock, 38 runs per leg on `main`:
    #
    #   darwin/arm64   16m31s - 32m01s, 0 killed  -> 45
    #   windows/amd64  23m48s - 42m06s, 0 killed  -> 60
    #   darwin/amd64   22m22s - 44m28s, 8 killed  -> 90
    #
    # darwin/amd64's distribution is right-CENSORED by the 45min wall replaced
    # here, so 44m28s is a floor, not a maximum. Reconstructing the killed runs
    # from their phase timings puts the real requirement near 56min. 90
    # clears the censored region so the true tail becomes observable; tighten
    # once it is. windows/amd64 has never been killed but sits at 94% of the old
    # wall, so it is raised too; darwin/arm64 has 29% margin and stays.
    #
    # The macOS TUN step's own rebuild is gone (its feature set now matches), so
    # the darwin measurements above predate that — re-measure those legs before
    # tightening. windows/amd64 is unaffected; its TUN step already matched. The
    # `hole` → `hole-tests` cascade still recompiles the shared crates (#723).
    #
    # The `ci_installer_assembly_jobs_share_a_timeout_budget` conformance test
    # does not cover these: it selects jobs whose xtask cascade reaches a
    # `uv run --directory <name>-installer build` handoff, and `hole-tests`
    # (-> hole -> galoshes -> ex-ray) reaches none. Should that cascade ever
    # gain an installer edge, this job joins that class and must match it.
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows, arch: amd64, runner: windows-latest, timeout: 60 }
          - { os: darwin,  arch: amd64, runner: macos-15-intel, timeout: 90 }
          - { os: darwin,  arch: arm64, runner: macos-latest,   timeout: 45 }
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-build

      - uses: cargo-bins/cargo-binstall@v1.21.1

      - name: Install nextest
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: cargo binstall --no-confirm --locked cargo-nextest

      # Compile test binaries via the orchestrator (resolves the full DAG:
      # ex-ray → galoshes → wintun → hole → hole-tests) but don't run
      # them yet — running tests is not part of the build process. The two
      # nextest invocations below execute the pre-built binaries with
      # different SKULD_LABELS filters; see #200 for the NDIS-loopback
      # corruption that motivates running TUN tests last (Windows only).
      - name: Build hole test binaries
        shell: bash
        run: cargo xtask build hole-tests

      # A SKULD_LABELS value that stops matching anything leaves its step a
      # silent no-op: the complementary one absorbs the whole suite and both
      # stay green. This asserts, before either runs, that the "!tun"/"tun"
      # pair below parses as exact complements and that each side still
      # selects at least one compiled-in test. Per-package contribution is
      # NOT checked — see `xtask::skuld_label_coverage` for why it can't be.
      - name: Verify SKULD_LABELS TUN/non-TUN partition
        shell: bash
        run: cargo xtask verify-skuld-label-coverage --job test-hole

      # A rename applied to only one of the two places that must agree — the
      # `.config/nextest.toml` name-substring filter and the skuld label
      # attached at a test's definition site — silently drops it from the
      # `global_net_state` cross-binary serialization group. That reads as an
      # intermittent flake, not the rename that caused it — see
      # bindreams/hole#894.
      - name: Verify global_net_state label matches the nextest.toml filter
        shell: bash
        run: cargo xtask verify-global-net-state-labels --job test-hole

      # `--no-default-features` mirrors the `hole-tests` xtask target. Without
      # it Cargo recompiles `hole` with `tauri/custom-protocol` ON (different
      # feature set → different fingerprint → fresh build), which expands
      # `tauri::generate_context!()` in production mode and panics on
      # missing `ui/dist/`. See bindreams/hole#372. The
      # `--features tombstone/crash-dumps,tombstone/crash-child` + `package(tombstone)`
      # also mirror `hole-tests` so the crash-marker tests `build hole-tests`
      # compiled actually run (matching feature set → no rebuild). See #522.
      # The `ci_test_hole_steps_match_the_hole_tests_target` conformance test
      # holds every nextest step here equal to that target's `run:`.
      - name: Test (non-TUN)
        id: test-non-tun
        shell: bash
        env:
          SKULD_LABELS: "!tun"
        run: >
          cargo nextest run --no-default-features
          --features tombstone/crash-dumps,tombstone/crash-child
          -E 'package(hole) + package(hole-bridge) + package(hole-common)
              + package(tun-engine) + package(tun-engine-macros)
              + package(dump) + package(dump-macros)
              + package(handle-holders) + package(tombstone)
              + package(hole-test-observability)'

      # Quoted: an unquoted ` #` opens a YAML comment and truncates the name.
      - name: "Test (TUN, runs last for #200)"
        if: matrix.os == 'windows' && matrix.arch == 'amd64'
        id: test-tun
        shell: bash
        env:
          SKULD_LABELS: "tun"
        run: >
          cargo nextest run --no-default-features
          --features tombstone/crash-dumps,tombstone/crash-child
          -E 'package(hole) + package(hole-bridge) + package(hole-common)
              + package(tun-engine) + package(tun-engine-macros)
              + package(dump) + package(dump-macros)
              + package(handle-holders) + package(tombstone)
              + package(hole-test-observability)'

      # macOS TUN lane runs UNDER ROOT: the lockdown real-engage test (#527)
      # drives `pfctl -E`/`-f`, which require root. The runner's cargo/nextest
      # and the user-owned `target/` are reused via `sudo env PATH/HOME` (the
      # binaries are prebuilt above; nextest only re-executes them). macOS
      # runners have passwordless sudo. Windows engages WFP from the elevated
      # token above; macOS has no such token, so root is the equivalent.
      #
      # `--features` must match `Build hole test binaries` and the non-TUN
      # step above (see that comment) or cargo rebuilds instead of reusing
      # the prebuilt binaries.
      - name: Test (TUN, macOS — root for pfctl)
        if: matrix.os == 'darwin'
        id: test-tun-macos
        shell: bash
        run: >
          sudo env "PATH=$PATH" "HOME=$HOME" SKULD_LABELS=tun
          cargo nextest run --no-default-features
          --features tombstone/crash-dumps,tombstone/crash-child
          -E 'package(hole) + package(hole-bridge) + package(hole-common)
              + package(tun-engine) + package(tun-engine-macros)
              + package(dump) + package(dump-macros)
              + package(handle-holders) + package(tombstone)
              + package(hole-test-observability)'

      # Upload bridge.log produced by `DistHarness` subprocesses. Matches
      # files that the test harness redirected to `$RUNNER_TEMP` (see
      # `crates/bridge/src/test_support/dist_harness.rs::new_tempdir`).
      - name: Upload bridge logs on test failure
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: bridge-logs-${{ matrix.os }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/**/bridge.log
          if-no-files-found: ignore
          retention-days: 14

  # Plugin interop/e2e area (crate `plugin-e2e`, #435): ex-ray<->stock interop on
  # all 6 platforms (QUIC not(windows)) + galoshes server<->client roundtrips
  # (WS all platforms; WS-TLS/QUIC not(windows)). A fresh build (NOT the archive lane that test-garter /
  # test-galoshes use) because these spawn plugin BINARIES and need on-disk
  # artifacts: ex-ray + galoshes (from setup-build's `cargo xtask deps`) and the
  # pinned stock v2ray-plugin (provisioned by the `plugin-e2e-tests` build.yaml
  # target). Shaped like `test-hole`.
  test-plugin-e2e:
    name: Test plugin-e2e (${{ matrix.os }}/${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows, arch: amd64, runner: windows-latest }
          - { os: darwin,  arch: amd64, runner: macos-15-intel }
          - { os: darwin,  arch: arm64, runner: macos-latest }
          - { os: linux,   arch: amd64, runner: ubuntu-latest }
          - { os: linux,   arch: arm64, runner: ubuntu-24.04-arm }
          - { os: windows, arch: arm64, runner: windows-11-arm }
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-build

      - uses: cargo-bins/cargo-binstall@v1.21.1

      - name: Install nextest
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: cargo binstall --no-confirm --locked cargo-nextest

      # `cargo xtask run plugin-e2e-tests` runs the target's build cascade
      # (provision-upstream-v2ray + the `--no-run` compile; ex-ray + galoshes via
      # the `depends: galoshes` chain) and then the nextest run. setup-build's
      # `cargo xtask deps` has already built ex-ray + galoshes. Interop runs on
      # all 6 platforms (QUIC not(windows)); galoshes roundtrips run on all (WS-TLS/QUIC not(windows)).
      - name: Test plugin-e2e
        shell: bash
        run: cargo xtask run plugin-e2e-tests

  # ex-ray Go unit tests (the `ex-ray-tests` build.yaml target). This is the
  # ONLY CI that runs Go tests: prek runs golangci-lint on the ex-ray wrapper
  # but excludes third_party/v2ray-core and executes no tests. It gives the ECH
  # fail-closed gate CI teeth — ex-ray's buildTLSConfig plus the patched vendored
  # tls/quic/hysteria2 (incl. utls) gate/refuse/round-trip tests. The two ECH
  # client transports ex-ray can't select (uTLS, hysteria2) are exercised here
  # since the plugin-e2e roundtrips can only drive ws-tls + QUIC. Single linux
  # runner: the gate logic is platform-independent (domainsocket is !windows).
  test-ex-ray:
    name: Test ex-ray (Go)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-build

      - name: Test ex-ray Go (ECH gate)
        run: cargo xtask run ex-ray-tests

  # Runs the ex-ray-unit-tests target (build.yaml) on windows/darwin -- see there
  # for why it is split from test-ex-ray.
  test-ex-ray-platforms:
    name: Test ex-ray (Go, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-build

      - name: Test ex-ray Go
        shell: bash
        run: cargo xtask run ex-ray-unit-tests

  test-installer:
    name: Test installer (windows/amd64)
    runs-on: windows-latest
    # The installer-assembly budget, held equal to `test-dmg-signing` by
    # `ci_installer_assembly_jobs_share_a_timeout_budget`. Sized for a cold
    # sccache: GitHub evicts cache entries untouched for 7 days, so the first
    # run after a quiet week compiles the workspace from scratch.
    timeout-minutes: 60
    env:
      # renovate: datasource=github-releases depName=gerardog/gsudo
      GSUDO_VERSION: "2.6.1"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v10.0.1
      - uses: ./.github/actions/setup-build

      - name: Test
        working-directory: msi-installer
        run: uv run --group dev pytest -v

      - name: Build MSI
        run: cargo xtask build hole-msi

      - name: Smoke-test binary
        run: target\release\hole.exe version

      - name: Install
        shell: pwsh
        run: |
          $log = "$env:RUNNER_TEMP\msi-install.log"
          $proc = Start-Process msiexec -ArgumentList "/i","target\release\hole.msi","/quiet","/norestart","/l*vx",$log -Wait -PassThru
          if ($proc.ExitCode -ne 0) {
            Get-Content $log -Tail 50
            throw "msiexec /i failed with exit code $($proc.ExitCode)"
          }

      - name: Verify install
        shell: pwsh
        run: |
          $binDir = "C:\Program Files\hole\bin"
          foreach ($f in @("hole.exe", "ex-ray.exe", "galoshes.exe", "wintun.dll")) {
            if (!(Test-Path "$binDir\$f")) { throw "$f not found" }
          }
          $svc = Get-Service -Name HoleBridge -ErrorAction SilentlyContinue
          if (!$svc) { throw "HoleBridge service not registered" }
          $path = [Environment]::GetEnvironmentVariable("Path", "Machine")
          if ($path -notmatch [regex]::Escape($binDir)) { throw "$binDir not in PATH" }

      # WebDriverIO smoke test against the INSTALLED binary, gating
      # bindreams/hole#372 (dashboard loads bundled frontend, not the
      # WebView2 "localhost refused" error page).
      #
      # tauri-driver is installed via `cargo install`; the cargo registry
      # cache + sccache from setup-build keep this fast across runs.
      # `--locked` and a pinned version guard against flakes from
      # unrelated bumps in the tauri-driver crate.
      - name: Install tauri-driver
        run: cargo install --locked --version 2.0.6 tauri-driver

      # tauri-driver speaks to WebView2 via Microsoft Edge's WebDriver.
      # The runner's bundled msedgedriver (`$EDGEWEBDRIVER`) targets the
      # Edge BROWSER version on the image, but WebView2 RUNTIME (which
      # hole.exe actually loads) auto-updates independently and is
      # typically a higher version — msedgedriver then rejects the
      # session with "only supports Microsoft Edge version N". Detect
      # the installed WebView2 runtime version and download the matching
      # msedgedriver from Microsoft's CDN. See bindreams/hole#372.
      - name: Install msedgedriver matching WebView2 runtime
        shell: pwsh
        run: |
          $key = "HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}"
          $webview2 = (Get-ItemProperty -Path $key -Name pv).pv
          Write-Host "WebView2 runtime version: $webview2"
          $url = "https://msedgedriver.microsoft.com/$webview2/edgedriver_win64.zip"
          $zip = "$env:RUNNER_TEMP\edgedriver.zip"
          $out = "$env:RUNNER_TEMP\edgedriver"
          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $out -Force
          Add-Content -Path $env:GITHUB_PATH -Value $out

      # The MSI's `LaunchApp` custom action runs `hole.exe --show-dashboard`
      # after a fresh install. Tauri's single-instance plugin would route
      # tauri-driver's new launch into that already-running instance, so we
      # need a clean slate. `Stop-Process -Force` calls `TerminateProcess`
      # synchronously; the subsequent `Wait-Process -ErrorAction Ignore`
      # waits for the process object to be reaped without depending on a
      # wall-clock delay.
      - name: Kill any running hole.exe (post-install LaunchApp)
        shell: pwsh
        run: |
          Get-Process hole -ErrorAction SilentlyContinue | Stop-Process -Force
          Wait-Process -Name hole -ErrorAction SilentlyContinue

      # gsudo runs the dashboard E2E at Medium integrity. GitHub runners run
      # every process at High integrity (admin + UAC disabled), and WebView2
      # Runtime 150 broke the DevTools loopback for High-integrity hosts
      # (MicrosoftEdge/WebView2Feedback#5640) so tauri-driver can't attach.
      # Real users run the GUI unprivileged (Medium), where 150 works.
      - name: Install gsudo (de-elevation for the E2E)
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\gsudo.zip"
          $dir = "$env:RUNNER_TEMP\gsudo"
          Invoke-WebRequest -Uri "https://github.com/gerardog/gsudo/releases/download/v$env:GSUDO_VERSION/gsudo.portable.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dir -Force
          $exe = "$dir\x64\gsudo.exe"
          if (-not (Test-Path $exe)) { throw "gsudo.exe not found at $exe after extract" }
          "$dir\x64" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      # Prove on the real runner that de-elevation preserves everything the E2E
      # needs — integrity (Medium), env vars, PATH (npm), streamed stdout, and
      # the exact exit code — via the SAME gsudo -> powershell -File launcher
      # the E2E uses. Fails loud here rather than as an opaque session timeout.
      - name: Verify gsudo de-elevation contract
        shell: pwsh
        run: |
          $env:HOLE_SELFTEST_CANARY = "canary-ok"
          # The child streams its IL=.../PROBE_OK line straight to the log and
          # exits 7 only when every contract check passes -- a nonzero sentinel
          # that also proves the exit code survives the launcher. Gate on that
          # and set the step's exit code explicitly (a lingering $LASTEXITCODE=7
          # would otherwise fail the step under GitHub's pwsh wrapper).
          pwsh -NoProfile -File .github/scripts/run-at-medium.ps1 -Script .github/scripts/verify-gsudo-deelevation.ps1
          $code = $LASTEXITCODE
          if ($code -ne 7) { Write-Host "::error::gsudo de-elevation contract failed (exit $code); see child output above"; exit 1 }
          Write-Host "OK: de-elevation verified (Medium + env + PATH + stdout + exit code)"
          exit 0

      # Run the dashboard E2E at Medium integrity through the shared launcher.
      # The installed-binary guard lives in e2e-medium.ps1 (inside the child),
      # so it runs where wdio actually reads HOLE_TEST_APP_PATH. `node_modules/`
      # is reused from the `frontend-build` that produced the MSI.
      - name: E2E dashboard test (Medium integrity)
        shell: pwsh
        env:
          HOLE_TEST_APP_PATH: 'C:\Program Files\hole\bin\hole.exe'
        run: |
          pwsh -NoProfile -File .github/scripts/run-at-medium.ps1 -Script .github/scripts/e2e-medium.ps1
          exit $LASTEXITCODE

      - name: Kill hole.exe after E2E
        if: always()
        shell: pwsh
        run: |
          Get-Process hole -ErrorAction SilentlyContinue | Stop-Process -Force

      - name: Dump install log on failure
        if: failure()
        shell: pwsh
        run: |
          $log = "$env:RUNNER_TEMP\msi-install.log"
          if (Test-Path $log) { Get-Content $log -Tail 200 }

      - name: Uninstall
        if: always()
        shell: pwsh
        run: |
          $log = "$env:RUNNER_TEMP\msi-uninstall.log"
          $proc = Start-Process msiexec -ArgumentList "/x","target\release\hole.msi","/quiet","/norestart","/l*vx",$log -Wait -PassThru
          if ($proc.ExitCode -ne 0) {
            Get-Content $log -Tail 50
            Write-Warning "msiexec /x failed with exit code $($proc.ExitCode)"
          }

      - name: Verify uninstall
        if: always()
        shell: pwsh
        run: |
          $binDir = "C:\Program Files\hole\bin"
          if (Test-Path $binDir) { throw "$binDir still exists" }
          $svc = Get-Service -Name HoleBridge -ErrorAction SilentlyContinue
          if ($svc) { throw "HoleBridge service still registered" }
          $path = [Environment]::GetEnvironmentVariable("Path", "Machine")
          if ($path -match [regex]::Escape($binDir)) { throw "$binDir still in PATH" }

  # Darwin-only counterpart to `test-installer`: build the DMG and run the
  # signature-consistency tests in `dmg-installer/`. Catches issue #364 —
  # an unsigned .app bundle that launches "damaged" under Gatekeeper
  # quarantine. Always runs (no path filter) so this stays a stable
  # required check on every PR.
  test-dmg-signing:
    name: Test DMG signing (${{ matrix.os }}/${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    # The installer-assembly budget, held equal to `test-installer` by
    # `ci_installer_assembly_jobs_share_a_timeout_budget`. The darwin/amd64 leg
    # sets the requirement: `macos-15-intel` runs ~1.7x slower than the arm64
    # runner across every phase — ~25 min on a warm sccache, and 45m45s measured
    # on a fully cold one (5% hit rate, the first run after a 7-day cache
    # eviction). Roughly 8 min of that is the duplicated Rust build in #714.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: darwin, arch: amd64, runner: macos-15-intel }
          - { os: darwin, arch: arm64, runner: macos-latest }
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v10.0.1
      - uses: ./.github/actions/setup-build

      # One build+test via the run-cascade (builds hole-dmg once, then the
      # signing pytest). A separate `build hole-dmg` step would double-roll the
      # flaky bundle_dmg.sh/hdiutil pipeline. See #446.
      - name: Build DMG and test signing
        run: cargo xtask run hole-dmg-tests

      # hdiutil DMG creation/mounting is a non-deterministic macOS
      # DiskArbitration race; capture system state on any failure (build or the
      # pytest mount) to diagnose the next occurrence (#446). Note `if: failure()`
      # does not fire when a timeout kills the job — that surfaces as `cancelled`,
      # so a budget overrun leaves no diagnostics here.
      # `--last 60m` spans the job's whole lifetime (timeout-minutes: 60).
      - name: Capture DiskArbitration/hdiutil state on failure
        if: failure()
        shell: bash
        run: |
          set +e
          OUT="$RUNNER_TEMP/dmg-flake-diag"
          mkdir -p "$OUT"
          hdiutil info    > "$OUT/hdiutil-info.txt" 2>&1
          ls -la /Volumes > "$OUT/volumes.txt"      2>&1
          mount           > "$OUT/mount.txt"        2>&1
          log show --last 60m --predicate \
            'process == "diskarbitrationd" OR process == "diskimagesiod" OR process == "mds" OR process == "mds_stores"' \
            > "$OUT/diskarb-log.txt" 2>&1
          echo "captured DMG-flake diagnostics to $OUT"

      - name: Upload DMG flake diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: dmg-flake-diag-${{ matrix.os }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/dmg-flake-diag/**
          if-no-files-found: ignore
          retention-days: 14

  # Renovate npm safety gate: builds the Vite bundle (via `cargo xtask build
  # frontend-build`) and type-checks (via `cargo xtask run frontend-check`,
  # which does its own `npm ci` + `npm run check` — tsc reads source directly
  # so it doesn't need the Vite bundle as a dep). Both steps are required
  # status checks for npm dependency PRs to automerge — see
  # .github/renovate.json. Single platform: `npm run check` / `vite build`
  # are platform-independent; the per-OS Tauri shell is exercised by the
  # release pipeline.
  frontend-check:
    name: Frontend check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm

      - uses: ./.github/actions/setup-rust
        id: setup-rust

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ steps.setup-rust.outputs.cachekey }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ steps.setup-rust.outputs.cachekey }}-

      - name: Build frontend
        run: cargo xtask build frontend-build

      - name: Type-check frontend
        run: cargo xtask run frontend-check
