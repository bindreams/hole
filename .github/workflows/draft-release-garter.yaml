name: Draft Release (garter)

# Thin caller for the shared draft-release reusable, plus a garter-only
# `cargo publish --dry-run` pre-check that runs before the reusable.
# See .github/workflows/reusable-draft-release.yaml.

on:
  workflow_dispatch:
    inputs: &inputs
      version:
        description: "garter release version (e.g. 0.1.0)"
        required: true
        type: string
  workflow_call:
    inputs: *inputs

jobs:
  # Garter-specific pre-check: surface crates.io publish blockers
  # (missing metadata, syntax, path-deps that won't resolve) BEFORE the
  # reusable kicks off CI.
  validate-cargo-publish:
    name: cargo publish --dry-run for garter library
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-rust
      - run: .github/scripts/cargo-fetch.sh
      # Packaging and its verify build run offline from the fetched sources, so a packaging error fails at once.
      - run: cargo package --offline -p garter
      # `cargo publish` always asks the registry; only that round trip is retried.
      - run: .github/scripts/retry.sh cargo publish --dry-run --no-verify -p garter

  draft:
    needs: validate-cargo-publish
    permissions:
      contents: write
    uses: ./.github/workflows/reusable-draft-release.yaml
    with:
      track: garter
      version: ${{ inputs.version }}
