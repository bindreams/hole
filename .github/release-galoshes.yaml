# Per-track release notes config for the `galoshes` release group.
# Consumed by scripts/generate-release-notes.py at release time.
#
# See docs/contributing/commit-messages.md.

initial_release: |
  Initial release of the standalone `galoshes` SIP003u plugin for
  shadowsocks server operators.

include_paths:
  # crates/garter/** is not listed: garter changes belong in garter release
  # notes; galoshes consumers wanting garter-library detail can read the
  # garter release notes directly.
  - crates/galoshes/**
  - crates/ex-ray/**
  - .github/workflows/draft-release-galoshes.yaml
  - .github/workflows/publish-release-galoshes.yaml
  - .github/release-galoshes.yaml
  # Workspace-engineering files affect every release track.
  - xtask/**
  - xtask-lib/**
  - scripts/generate-release-notes.py
  - Cargo.toml
  - Cargo.lock
  - build.yaml
  - prek.toml
  - .config/nextest.toml
  - clippy.toml

# Categories live in .github/release-categories.yaml (shared across all four tracks).
