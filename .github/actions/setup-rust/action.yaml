name: Setup Rust
description: >
  Install the Rust toolchain pinned in rust-toolchain.toml. This is the only
  place in the repo allowed to install a Rust toolchain — Renovate moves the
  pin, and everything else delegates here so CI and local `rustup` auto-install
  always agree.

outputs:
  cachekey:
    description: Forwarded from the toolchain-install step's cachekey output.
    value: ${{ steps.rust.outputs.cachekey }}

runs:
  using: composite
  steps:
    - name: Read the pinned channel
      id: pin
      shell: bash
      run: |
        channel=$(sed -n 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' rust-toolchain.toml)
        if [ -z "$channel" ]; then
          echo "::error::could not read [toolchain].channel from rust-toolchain.toml" >&2
          exit 1
        fi
        echo "channel=$channel" >> "$GITHUB_OUTPUT"

    - uses: dtolnay/rust-toolchain@master
      id: rust
      with:
        toolchain: ${{ steps.pin.outputs.channel }}
        components: clippy, rustfmt
