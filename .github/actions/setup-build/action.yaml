name: Setup Build
description: Set up a compilable Rust workspace (toolchains, cache, runtime deps)

runs:
  using: composite
  steps:
    - name: Set cargo env vars
      shell: bash
      run: |
        echo "CARGO_TERM_COLOR=always" >> "$GITHUB_ENV"
        echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
        echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"

    # `rust-toolchain.toml` is the single source of truth. It already governs
    # every `cargo` call through rustup's directory override; feeding `channel`
    # to the action too means the toolchain is installed up front, with
    # components, and `cachekey` tracks the pinned rustc rather than whatever
    # `stable` resolved to that morning.
    - name: Read pinned Rust toolchain
      id: rust-version
      shell: bash
      run: sed -n 's/^channel = "\(.*\)"$/toolchain=\1/p' rust-toolchain.toml >> "$GITHUB_OUTPUT"

    - uses: dtolnay/rust-toolchain@master
      id: rust-toolchain
      with:
        toolchain: ${{ steps.rust-version.outputs.toolchain }}
        components: clippy, rustfmt

    # The Go pin lives in the module's own `toolchain` directive, so a bare
    # `go` on PATH and CI resolve the same release.
    - uses: actions/setup-go@v7
      with:
        go-version-file: crates/ex-ray/go.mod

    # Node.js is required by the `frontend-build` xtask target, which is now
    # on `hole-msi.depends`. Without `npm`, Windows runners can't produce
    # `ui/dist/` and `tauri-codegen` panics at compile time when
    # `tauri/custom-protocol` is enabled. Pinned via `package.json`'s
    # `"engines": { "node": ">=24.0.0 <25.0.0" }`. See bindreams/hole#372.
    - uses: actions/setup-node@v7
      with:
        node-version-file: package.json
        cache: npm

    - uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
        key: cargo-${{ runner.os }}-${{ steps.rust-toolchain.outputs.cachekey }}-${{ hashFiles('Cargo.lock') }}
        restore-keys: cargo-${{ runner.os }}-${{ steps.rust-toolchain.outputs.cachekey }}-

    - uses: mozilla-actions/sccache-action@v0.0.11

    - name: Fetch runtime deps (ex-ray, wintun)
      shell: bash
      run: cargo xtask deps
