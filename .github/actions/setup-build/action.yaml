name: Setup Build
description: Set up a compilable Rust workspace (toolchains, cache, runtime deps)

inputs:
  save-cache:
    description: >-
      Save the cargo cache at job end (see `cargo-cache`). Set by exactly one
      job per cache key (runner OS + rustc commit, no arch), and it saves only
      on `main`. Every other job, and every other ref, restores only; the
      release workflows deliberately never set it.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Set cargo env vars
      shell: bash
      run: |
        echo "CARGO_TERM_COLOR=always" >> "$GITHUB_ENV"
        echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
        echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"

    - uses: ./.github/actions/setup-rust
      id: setup-rust
      with:
        components: clippy, rustfmt

    # The Go pin lives in the module's own `toolchain` directive, so a bare
    # `go` on PATH and CI resolve the same release.
    - uses: actions/setup-go@v7
      with:
        go-version-file: crates/ex-ray/go.mod

    # Node.js is required by the `frontend-build` xtask target, which is now
    # on `hole-msi.depends`. Without `npm`, Windows runners can't produce
    # `ui/dist/` and `tauri-codegen` panics at compile time when
    # `tauri/custom-protocol` is enabled. Pinned via `package.json`'s
    # `engines.node`; its floor is the first Node 24 that distrusts the compromised
    # eMudhra intermediates, keeping a stale cached 24.x out. See bindreams/hole#372.
    - uses: actions/setup-node@v7
      with:
        node-version-file: package.json
        cache: npm

    - uses: ./.github/actions/cargo-cache
      with:
        cachekey: ${{ steps.setup-rust.outputs.cachekey }}
        save: ${{ inputs.save-cache }}

    - uses: mozilla-actions/sccache-action@v0.0.11

    # Compiling `xtask` below fetches crates, so a network loss would fail it
    # with no product defect behind it; `retry.sh` waits for the network.
    - name: Fetch crate sources
      shell: bash
      run: .github/scripts/retry.sh cargo fetch --locked

    - name: Fetch runtime deps (ex-ray, wintun)
      shell: bash
      run: cargo xtask deps
