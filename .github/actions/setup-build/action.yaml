name: Setup Build
description: Set up a compilable Rust workspace (toolchains, cache, runtime deps)

runs:
  using: composite
  steps:
    - name: Set cargo env vars
      shell: bash
      run: |
        echo "CARGO_TERM_COLOR=always" >> "$GITHUB_ENV"
        echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
        echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"

    - uses: ./.github/actions/setup-rust
      id: setup-rust
      with:
        components: clippy, rustfmt

    # The Go pin lives in the module's own `toolchain` directive, so a bare
    # `go` on PATH and CI resolve the same release.
    - uses: actions/setup-go@v7
      with:
        go-version-file: crates/ex-ray/go.mod

    # Node.js is required by the `frontend-build` xtask target, which is now
    # on `hole-msi.depends`. Without `npm`, Windows runners can't produce
    # `ui/dist/` and `tauri-codegen` panics at compile time when
    # `tauri/custom-protocol` is enabled. Pinned via `package.json`'s
    # `"engines": { "node": ">=24.0.0 <25.0.0" }`. See bindreams/hole#372.
    - uses: actions/setup-node@v7
      with:
        node-version-file: package.json
        cache: npm

    # Only `main` saves. `actions/cache` post-saves by tarring first and
    # reserving the key after, so every parallel job sharing the key pays the
    # full tar and all but the first to finish then fail with "Unable to
    # reserve cache ... another job may be creating this cache". On Windows
    # that tar takes 1.3-7.6 min, which is what ran past the job wall in
    # bindreams/hole#1044. A PR-ref cache is also visible to that PR alone,
    # so a PR save fed nothing but the repo's 10 GB cache quota. PRs restore
    # `main`'s cache through `restore-keys`.
    - uses: actions/cache/restore@v6
      if: github.ref != 'refs/heads/main'
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
        key: cargo-${{ runner.os }}-${{ steps.setup-rust.outputs.cachekey }}-${{ hashFiles('Cargo.lock') }}
        restore-keys: cargo-${{ runner.os }}-${{ steps.setup-rust.outputs.cachekey }}-

    - uses: actions/cache@v6
      if: github.ref == 'refs/heads/main'
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
        key: cargo-${{ runner.os }}-${{ steps.setup-rust.outputs.cachekey }}-${{ hashFiles('Cargo.lock') }}
        restore-keys: cargo-${{ runner.os }}-${{ steps.setup-rust.outputs.cachekey }}-

    - uses: mozilla-actions/sccache-action@v0.0.11

    - name: Fetch runtime deps (ex-ray, wintun)
      shell: bash
      run: cargo xtask deps
