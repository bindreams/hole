name: Verify the release commit is on main
description: Fail unless the commit this workflow runs on is an ancestor of origin/main

# `workflow_dispatch` accepts --ref, so without this a draft can be pinned to unmerged code and every
# later check still passes. The caller checks out with `fetch-depth: 0` first so the ancestry can be resolved.

runs:
  using: composite
  steps:
    - name: Check ancestry
      shell: bash
      env:
        SHA: ${{ github.sha }}
      run: |
        set -euo pipefail
        git fetch --quiet origin main

        set +e
        git merge-base --is-ancestor "$SHA" origin/main
        STATUS=$?
        set -e

        case "$STATUS" in
          0) echo "$SHA is an ancestor of origin/main" ;;
          1)
            echo "::error::$SHA is not an ancestor of origin/main. Release only from merged commits."
            exit 1
            ;;
          *)
            echo "::error::git merge-base failed (exit $STATUS); cannot confirm $SHA is on main"
            exit 1
            ;;
        esac
