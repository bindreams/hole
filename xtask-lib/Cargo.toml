[package]
name = "xtask-lib"
version = "0.1.0"
edition = "2021"
publish = false

[lints]
workspace = true

[lib]
name = "xtask_lib"
path = "src/lib.rs"
harness = false

[features]
# Group-version computation (`version`/`ex_ray_version`), which pulls `toml` +
# `semver`. Off by default so a `bindir`/`repo_root`-only consumer — the SYSTEM/
# root bridge cutover — links neither. The build.rs version stamps + xtask
# enable it.
version = ["dep:semver", "dep:toml"]
# Opt-in derives for the shared `bindir::Os` enum. `xtask` enables both (it
# deserializes `Os` from build.yaml and exposes it as a clap arg); the bridge
# cutover enables neither (it only needs the pure name-set fns).
serde = ["dep:serde"]
clap = ["dep:clap"]
# `frontend_dist`: the check a Tauri build script runs before tauri-build, over the
# same config types and merge tauri-build uses. Off by default so a
# `bindir`/`repo_root`-only consumer links none of it.
tauri-config = ["dep:tauri-utils", "dep:json-patch", "dep:serde_json", "dep:path-clean"]

[dependencies]
anyhow = "1"
semver = { version = "1", optional = true }
toml = { version = "1.0", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
clap = { version = "4", features = ["derive"], optional = true }
# The same majors tauri-build requires, so the lockfile keeps one copy of each.
tauri-utils = { version = "2", optional = true }
json-patch = { version = "4", optional = true }
serde_json = { version = "1", optional = true }
path-clean = { version = "1", optional = true }

[dev-dependencies]
skuld = { workspace = true }
tempfile = "3"
