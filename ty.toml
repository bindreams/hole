[environment]
# Scripts target both Windows and POSIX — `scripts/network-reset.py`
# calls POSIX-only APIs (os.geteuid, os.getgrouplist, pwd.getpwnam)
# inside platform guards. Telling ty to assume all platforms makes those
# attributes resolve instead of failing with unresolved-attribute on the
# Windows CI runner.
python-platform = "all"

# `docs/conf.py` and `scripts/validate-docs.py` both import `docs/_versions.py`
# after a sys.path insert, which ty cannot see.
extra-paths = ["docs"]

[rules]
# PEP 723 inline script dependencies are not visible to ty's module resolver.
unresolved-import = "ignore"

# xml.etree type stubs are incomplete; these are false positives.
[[overrides]]
include = ["msi-installer/tests/**"]

[overrides.rules]
invalid-return-type = "ignore"
unresolved-attribute = "ignore"
